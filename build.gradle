// Generate version.properties on every build.
tasks.register('generateVersionProperties') {
	def outputDir = generatedResourcesDir
	outputs.dir(outputDir)
	// Always recreate it because version metadata can change through dirty/commit state.
	outputs.upToDateWhen { false }
	doLast {
		def dir = outputDir.get().asFile
		dir.mkdirs()
		def versionCode = '0'
		try {
			versionCode = 'git rev-list --count HEAD'.execute().text.trim() ?: '0'
		} catch (ignored) {}
		new File(dir, 'version.properties').text =
			"version=${applicationVersion}\n" +
			"versionCode=${versionCode}\n"
	}
}

