// ============================================================
// jpackage: создание нативного инсталлятора
// Windows: .msi, macOS: .dmg, Linux: .deb
// Использование: ./gradlew jpackage
// ============================================================
tasks.register('jpackage') {
	dependsOn installDist
	group = 'distribution'
	description = 'Создать нативный инсталлятор через jpackage'

	doLast {
		def os = org.gradle.internal.os.OperatingSystem.current()
		def installDir = layout.buildDirectory.dir("install/${project.name}").get().asFile
		def outputDir = layout.buildDirectory.dir("jpackage").get().asFile
		if (outputDir.exists()) outputDir.deleteDir()
		outputDir.mkdirs()
		def appVersion = resolvePackageVersion(os)

		def javaHome = resolvePackagingJavaHome()
		logger.lifecycle("jpackage: using Java runtime from ${javaHome}")

		def jpackageBin = os.isWindows()
			? "${javaHome}/bin/jpackage.exe"
			: "${javaHome}/bin/jpackage"

		def libDir = preparePackagingLibDir(os, installDir, new File(outputDir, 'input'))
		def jvmArgsList = buildPackagingJvmArgs()
		def jlinkOptions = buildPackagingJlinkOptions()

		// macOS: app-image → копируем Icon Composer ресурсы → DMG
		def macBuild = os.isMacOsX()
		File linuxResourceDir = null

		if (os.isLinux()) {
			linuxResourceDir = prepareLinuxPackagingResources()
		}

		def args = [
			jpackageBin,
			'--type', os.isWindows() ? 'msi' : (macBuild ? 'app-image' : 'deb'),
			'--name', 'MeshApp',
			'--app-version', appVersion,
			'--vendor', 'Meshtastic',
			'--copyright', 'Copyright © Konstantin A. Smirnov',
			'--dest', outputDir.absolutePath,
			'--input', libDir.absolutePath,
			'--jlink-options', jlinkOptions,
			'--main-jar', "${project.name}-${project.version}.jar",
			'--main-class', application.mainClass.get(),
		]

		jvmArgsList.each { arg ->
			args << '--java-options'
			args << arg
		}

		// Иконка для jpackage (Windows .ico, macOS — заменяется Icon Composer версией)
		if (os.isWindows()) {
			def icoFile = file('src/main/resources/logo/MeshApp.ico')
			if (icoFile.exists()) {
				args << '--icon'
				args << icoFile.absolutePath
			}
		} else if (macBuild) {
			def icnsFile = file('src/main/resources/macos/MeshApp.icns')
			if (icnsFile.exists()) {
				args << '--icon'
				args << icnsFile.absolutePath
			}
		} else {
			def pngFile = file('src/main/resources/logo/icon_512.png')
			if (pngFile.exists()) {
				args << '--icon'
				args << pngFile.absolutePath
			}
		}

		if (os.isWindows()) {
			args << '--win-dir-chooser'
			args << '--win-shortcut'
			args << '--win-menu'
			args << '--win-upgrade-uuid'
			args << 'd5765678-89ab-4def-8123-456789abcdef'
		}

		if (!os.isWindows() && !macBuild) {
			args << '--linux-shortcut'
			if (linuxResourceDir != null) {
				args << '--resource-dir'
				args << linuxResourceDir.absolutePath
			}
		}

		if (macBuild) {
			args << '--mac-package-identifier'
			args << 'com.meshtastic.meshapp'
			args << '--mac-package-name'
			args << 'MeshApp'
		}

		// Шаг 1: создать app-image (macOS) или финальный инсталлятор (Windows/Linux)
		def strArgs = args.collect { it.toString() }
		def proc1 = new ProcessBuilder(strArgs).redirectErrorStream(true).start()
		def proc1Output = proc1.inputStream.text
		proc1.waitFor()
		if (proc1Output) logger.lifecycle(proc1Output.trim())
		if (proc1.exitValue() != 0) throw new GradleException("jpackage failed with exit code ${proc1.exitValue()}")
		if (os.isLinux() && !macBuild) {
			// jpackage auto-detects Debian dependencies from the build host and appends
			// custom deps instead of replacing them. On Ubuntu 24.04+ this bakes in
			// t64 package names (libasound2t64, libgtk-3-0t64, etc.), which are not
			// installable as-is on older Ubuntu. Repack the .deb and widen those deps
			// to "old-name | new-name" alternatives.
			patchLinuxDebControl(outputDir)
		}

		// macOS шаг 2: патчить Info.plist, скопировать Assets.car, собрать DMG
		if (macBuild) {
			def appDir = new File(outputDir, "MeshApp.app")
			def resourcesDir = new File(appDir, "Contents/Resources")

			// Добавить NSBluetoothAlwaysUsageDescription — без него macOS 10.15+
			// убивает процесс при инициализации CBCentralManager (BLE)
			def infoPlist = new File(appDir, "Contents/Info.plist")
			if (infoPlist.exists()) {
				def plistText = infoPlist.text
				if (!plistText.contains('NSBluetoothAlwaysUsageDescription')) {
					plistText = plistText.replace('</dict>', """\
 <key>NSBluetoothAlwaysUsageDescription</key>
 <string>MeshApp uses Bluetooth to connect to Meshtastic devices.</string>
</dict>""")
					infoPlist.text = plistText
					logger.lifecycle("jpackage: NSBluetoothAlwaysUsageDescription добавлен в Info.plist")
				}
			}

			// Assets.car содержит иконку из Icon Composer с вариантами стилей
			def assetsCar = file('src/main/resources/macos/Assets.car')
			if (assetsCar.exists()) {
				java.nio.file.Files.copy(assetsCar.toPath(), new File(resourcesDir, assetsCar.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
				logger.lifecycle("jpackage: Assets.car скопирован в бандл")
			}

			normalizeMacBundleInstallNames(appDir, 'jpackage')

			// Release bundle должен быть самодостаточным: допускаем только @rpath/@loader_path
			// и системные Apple библиотеки. Любые /opt/homebrew, /usr/local, $HOME и т.п. запрещены.
			assertMacBundleSelfContained(appDir, 'jpackage')

			def entitlements = file('src/main/resources/macos/entitlements.plist')
			def macSigningConfig = resolveMacSigningConfig()
			def macNotarizationConfig = resolveMacNotarizationConfig()
			if (macNotarizationConfig != null && macSigningConfig == null) {
				throw new GradleException("macOS notarization requires Developer ID signing credentials")
			}

			if (macSigningConfig != null) {
				def signArgs = [
					jpackageBin,
					'--type', 'app-image',
					'--app-image', appDir.absolutePath
				]
				appendMacSigningOptions(signArgs, macSigningConfig, true, entitlements)
				executePackagingCommand(signArgs, "Developer ID signing failed for ${appDir.name}")
				executePackagingCommand(
					['codesign', '--verify', '--deep', '--strict', appDir.absolutePath],
					"Signature verification failed for ${appDir.name}"
				)
				logger.lifecycle("jpackage: Developer ID подпись применена к ${appDir.name}")
			} else {
				// Локальный fallback: ad-hoc подпись убирает immediate launch failures,
				// но не подходит для распространяемого из интернета DMG.
				adHocSignMacBundle(appDir, entitlements)
				logger.lifecycle("jpackage: ad-hoc подпись применена и верифицирована")
			}

			// Собрать DMG
			def dmgFile = new File(outputDir, "MeshApp-${appVersion}.dmg")
			if (dmgFile.exists()) dmgFile.delete()

			def dmgArgs = [
				jpackageBin,
				'--type', 'dmg',
				'--name', 'MeshApp',
				'--app-version', appVersion,
				'--app-image', appDir.absolutePath,
				'--dest', outputDir.absolutePath,
				'--mac-package-identifier', 'com.meshtastic.meshapp',
				'--mac-package-name', 'MeshApp'
			]
			appendMacSigningOptions(dmgArgs, macSigningConfig, false, entitlements)
			executePackagingCommand(dmgArgs, "jpackage DMG failed")
			if (!dmgFile.isFile()) {
				throw new GradleException("jpackage: DMG not found after build: ${dmgFile}")
			}
			if (macNotarizationConfig != null) {
				notarizeMacArtifact(dmgFile, macNotarizationConfig)
				logger.lifecycle("jpackage: DMG notarized and stapled")
			} else if (macSigningConfig != null) {
				logger.warn("jpackage: DMG signed with Developer ID but not notarized; Gatekeeper may still block downloaded builds")
			}
			logger.lifecycle("jpackage: DMG создан в ${outputDir}")
		}
	}
}

// ============================================================
// AppImage: создание portable Linux AppImage из jpackage app-image
// Использование: ./gradlew appImage [-Pappimagetool=/path/to/appimagetool.AppImage]
// ============================================================
tasks.register('appImage') {
	dependsOn installDist
	mustRunAfter tasks.named('jpackage')
	group = 'distribution'
	description = 'Собрать portable Linux AppImage'

	doLast {
		def os = org.gradle.internal.os.OperatingSystem.current()
		if (!os.isLinux()) {
			throw new GradleException('appImage task is supported only on Linux')
		}

		def installDir = layout.buildDirectory.dir("install/${project.name}").get().asFile
		def outputDir = layout.buildDirectory.dir("jpackage").get().asFile
		def workDir = layout.buildDirectory.dir("appimage").get().asFile
		outputDir.mkdirs()

		def appImage = buildLinuxAppImage(installDir, workDir, 'appImage')
		def iconSource = appImage.iconFile
		def jpackageImageDir = appImage.imageDir

		def appDir = new File(workDir, 'MeshApp.AppDir')
		project.copy {
			from jpackageImageDir
			into new File(appDir, 'usr')
		}

		def launcher = new File(appDir, 'usr/bin/MeshApp')
		if (!launcher.isFile()) {
			throw new GradleException("appImage: launcher not found in AppDir: ${launcher}")
		}

		def desktopSource = requirePackagingFile("${flatpakMetadataDir.path}/${flatpakDesktopFileName}", 'appImage')
		def desktopFile = new File(appDir, flatpakDesktopFileName)
		java.nio.file.Files.copy(
			desktopSource.toPath(),
			desktopFile.toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING
		)

		def shareApplicationsDir = new File(appDir, 'usr/share/applications')
		shareApplicationsDir.mkdirs()
		java.nio.file.Files.copy(
			desktopSource.toPath(),
			new File(shareApplicationsDir, flatpakDesktopFileName).toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING
		)

		def rootIcon = new File(appDir, "${flatpakAppId}.png")
		java.nio.file.Files.copy(
			iconSource.toPath(),
			rootIcon.toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING
		)
		java.nio.file.Files.copy(
			iconSource.toPath(),
			new File(appDir, '.DirIcon').toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING
		)

		def shareIconsDir = new File(appDir, 'usr/share/icons/hicolor/512x512/apps')
		shareIconsDir.mkdirs()
		java.nio.file.Files.copy(
			iconSource.toPath(),
			new File(shareIconsDir, "${flatpakAppId}.png").toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING
		)

		def appRun = new File(appDir, 'AppRun')
		appRun.text = '''\
#!/bin/sh
HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
exec "$HERE/usr/bin/MeshApp" "$@"
'''
		appRun.setExecutable(true, false)

		def appImageTool = resolveAppImageTool()
		if (appImageTool == null) {
			throw new GradleException('appImage: appimagetool not found. Add it to PATH or pass -Pappimagetool=/path/to/appimagetool.AppImage')
		}

		def artifactName = "MeshApp-${sanitizeArtifactVersion(project.version.toString())}-${resolveLinuxAppImageArch()}.AppImage"
		def appImageFile = new File(outputDir, artifactName)
		if (appImageFile.exists()) {
			appImageFile.delete()
		}

		def appImageProc = new ProcessBuilder(
			appImageTool.absolutePath,
			'--no-appstream',
			appDir.absolutePath,
			appImageFile.absolutePath
		).redirectErrorStream(true)
		def env = appImageProc.environment()
		env.put('ARCH', resolveLinuxAppImageArch())
		env.put('VERSION', project.version.toString())
		if (appImageTool.name.endsWith('.AppImage') && !env.containsKey('APPIMAGE_EXTRACT_AND_RUN')) {
			env.put('APPIMAGE_EXTRACT_AND_RUN', '1')
		}

		def appImageProcess = appImageProc.start()
		def appImageOutput = appImageProcess.inputStream.text
		appImageProcess.waitFor()
		if (appImageOutput) logger.lifecycle(appImageOutput.trim())
		if (appImageProcess.exitValue() != 0) {
			throw new GradleException("appImage: appimagetool failed with exit code ${appImageProcess.exitValue()}")
		}

		appImageFile.setExecutable(true, false)
		logger.lifecycle("appImage: AppImage создан в ${appImageFile}")
	}
}

// ============================================================
// Flatpak: создание sandboxed Linux bundle через flatpak-builder
// Использование: ./gradlew flatpak
// Требует: flatpak + flatpak-builder + установленный runtime/SDK
// ============================================================
tasks.register('flatpak') {
	dependsOn installDist
	mustRunAfter tasks.named('jpackage')
	mustRunAfter tasks.named('appImage')
	group = 'distribution'
	description = 'Собрать Linux Flatpak bundle'

	doLast {
		def os = org.gradle.internal.os.OperatingSystem.current()
		if (!os.isLinux()) {
			throw new GradleException('flatpak task is supported only on Linux')
		}

		def installDir = layout.buildDirectory.dir("install/${project.name}").get().asFile
		def outputDir = layout.buildDirectory.dir("jpackage").get().asFile
		def workDir = layout.buildDirectory.dir("flatpak").get().asFile
		if (workDir.exists()) {
			workDir.deleteDir()
		}
		workDir.mkdirs()
		outputDir.mkdirs()

		def flatpakRuntime = (findProperty('flatpakRuntime') ?: 'org.freedesktop.Platform').toString().trim()
		def flatpakRuntimeVersion = (findProperty('flatpakRuntimeVersion') ?: '24.08').toString().trim()
		def flatpakSdk = (findProperty('flatpakSdk') ?: 'org.freedesktop.Sdk').toString().trim()
		def flatpakBranch = (findProperty('flatpakBranch') ?: 'stable').toString().trim()
		def flatpakBuilder = resolveCommandExecutable('flatpakBuilder', 'FLATPAK_BUILDER', 'flatpak-builder', 'flatpak')
		def flatpakBin = resolveCommandExecutable('flatpakBin', 'FLATPAK_BIN', 'flatpak', 'flatpak')

		def appImage = buildLinuxAppImage(installDir, new File(workDir, 'app-image'), 'flatpak')
		def sourceDir = prepareFlatpakSources(workDir, appImage.imageDir, appImage.iconFile)
		def manifestFile = new File(workDir, "${flatpakAppId}.json")
		writeFlatpakManifest(manifestFile, sourceDir, flatpakRuntime, flatpakRuntimeVersion, flatpakSdk)

		def repoDir = new File(workDir, 'repo')
		def buildDir = new File(workDir, 'builder')
		executePackagingCommand(
			[
				flatpakBuilder.absolutePath,
				"--arch=${resolveLinuxAppImageArch()}",
				'--force-clean',
				"--repo=${repoDir.absolutePath}",
				"--default-branch=${flatpakBranch}",
				buildDir.absolutePath,
				manifestFile.absolutePath
			],
			'flatpak: flatpak-builder failed'
		)

		def artifactName = "MeshApp-${sanitizeArtifactVersion(project.version.toString())}-${resolveLinuxAppImageArch()}.flatpak"
		def bundleFile = new File(outputDir, artifactName)
		if (bundleFile.exists()) {
			bundleFile.delete()
		}

		executePackagingCommand(
			[
				flatpakBin.absolutePath,
				'build-bundle',
				"--arch=${resolveLinuxAppImageArch()}",
				repoDir.absolutePath,
				bundleFile.absolutePath,
				flatpakAppId,
				flatpakBranch
			],
			'flatpak: flatpak build-bundle failed'
		)

		logger.lifecycle("flatpak: Flatpak bundle создан в ${bundleFile}")
	}
}

// macOS: запуск через .app bundle для отображения в Dock и Cmd+Tab
if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
	tasks.register('runMac') {
		dependsOn classes
		group = 'application'
		description = 'Запуск на macOS через .app bundle (Dock + Cmd+Tab)'

		doLast {
			def appDir = layout.buildDirectory.dir("tmp/MeshApp.app").get().asFile
			def contentsDir = new File(appDir, "Contents")
			def macosDir = new File(contentsDir, "MacOS")
			def resourcesDir = new File(contentsDir, "Resources")
			macosDir.mkdirs()
			resourcesDir.mkdirs()

			// Скопировать иконку в .app bundle
			def icnsSource = file('src/main/resources/logo/MeshApp.icns')
			if (icnsSource.exists()) {
				java.nio.file.Files.copy(icnsSource.toPath(), new File(resourcesDir, icnsSource.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			}

			// Info.plist
			new File(contentsDir, "Info.plist").text = """\
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
  "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleName</key>
    <string>MeshApp</string>
    <key>CFBundleIdentifier</key>
    <string>com.meshtastic.meshapp</string>
    <key>CFBundleVersion</key>
    <string>1.0</string>
    <key>CFBundleExecutable</key>
    <string>run</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleIconFile</key>
    <string>MeshApp</string>
    <key>NSHighResolutionCapable</key>
    <true/>
    <key>NSBluetoothAlwaysUsageDescription</key>
    <string>MeshApp uses Bluetooth to connect to Meshtastic devices.</string>
</dict>
</plist>"""

			// Собрать classpath и module-path из Gradle
			def cpJars = []
			def fxJars = []
			sourceSets.main.runtimeClasspath.files.each { f ->
				if (f.name.startsWith('javafx-') && (f.name.contains('-mac') || f.name.contains('-aarch64'))) {
					fxJars << f.absolutePath
				} else {
					cpJars << f.absolutePath
				}
			}
			def cpStr = cpJars.join(':')
			def fxStr = fxJars.join(':')

			// Java из toolchain
			def javaLauncher = javaToolchains.launcherFor {
				languageVersion = JavaLanguageVersion.of(21)
			}.get()
			def javaPath = javaLauncher.executablePath.asFile.absolutePath

			def jvmArgsList = application.applicationDefaultJvmArgs
			def jvmArgsStr = jvmArgsList.collect { "    '${it}'" }.join(" \\\n")

			def script = new File(macosDir, "run")
			script.text = """\
#!/bin/bash
exec '${javaPath}' \\
${jvmArgsStr} \\
    --module-path '${fxStr}' \\
    --add-modules javafx.controls \\
    -cp '${cpStr}' \\
    ${application.mainClass.get()}
"""
			script.setExecutable(true)

			def signArgs = ['codesign', '--force', '--deep', '--sign', '-', appDir.absolutePath]
			def signProc = new ProcessBuilder(signArgs).redirectErrorStream(true).start()
			def signOut = signProc.inputStream.text
			signProc.waitFor()
			if (signOut) logger.lifecycle(signOut.trim())
			if (signProc.exitValue() != 0) {
				throw new GradleException("runMac codesign failed with exit code ${signProc.exitValue()}")
			}

			def verifyProc = new ProcessBuilder(
				'codesign', '--verify', '--deep', '--strict', appDir.absolutePath
			).redirectErrorStream(true).start()
			def verifyOut = verifyProc.inputStream.text
			verifyProc.waitFor()
			if (verifyOut) logger.lifecycle(verifyOut.trim())
			if (verifyProc.exitValue() != 0) {
				throw new GradleException("runMac signature verification failed with exit code ${verifyProc.exitValue()}")
			}

			// Запустить .app через 'open -W' (ждём завершения)
			def proc = ['open', '-W', appDir.absolutePath].execute()
			proc.consumeProcessOutput(System.out, System.err)
			proc.waitFor()
		}
	}
}
