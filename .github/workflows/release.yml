name: Build release
on:
  push:
    branches: ['codex/unstable/*']
  workflow_dispatch:
    inputs:
      version:
        description: '2.4.0 (stable draft from main) or 2.4.0-unstable.1 (prerelease from a branch)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: meshapp-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#codex/unstable/}-unstable.${GITHUB_RUN_NUMBER}"
          fi
          python3 scripts/ci/github-release.py preflight --version "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      MESHAPP_VERSION: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Prepare Linux packaging
        if: runner.os == 'Linux'
        run: bash scripts/ci/setup-linux.sh
      - name: Prepare Windows packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - name: Test release tooling
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts/ci/tests -v
      - name: Test and package
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export PACKAGING_JAVA_HOME="$JAVA_HOME"
          export FLATPAK_RELEASE_DATE="$(git log -1 --format=%cs)"
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a ./gradlew check jpackage appImage flatpak selfUpdateArchive verifySelfUpdatePackage --no-daemon --stacktrace -Pappimagetool="$RUNNER_TEMP/appimagetool.AppImage"
          else
            ./gradlew check jpackage selfUpdateArchive verifySelfUpdatePackage --no-daemon --stacktrace
          fi
      - name: Collect verified packages
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/ci/release.py collect --version "$MESHAPP_VERSION" --platform "$RELEASE_PLATFORM" --source build/jpackage --output build/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tests-${{ matrix.platform }}
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14
  draft:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      MESHAPP_VERSION: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: build/release
      - name: Verify complete release and create stable draft or unstable prerelease
        run: |
          python3 scripts/ci/release.py finalize --version "$MESHAPP_VERSION" --commit "$RELEASE_COMMIT" --repository "$GITHUB_REPOSITORY" --source build/release
          python3 scripts/ci/github-release.py draft --version "$MESHAPP_VERSION" --commit "$RELEASE_COMMIT" --repository "$GITHUB_REPOSITORY"
