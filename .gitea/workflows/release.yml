name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu
    steps:
      - run: |
          git clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"

      - name: Create Gitea Release
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"

          # Проверяем, указывает ли тег на коммит в main
          MAIN_SHA=$(git rev-parse origin/main 2>/dev/null || echo "")
          TAG_SHA=$(git rev-parse HEAD)

          if [ "$MAIN_SHA" = "$TAG_SHA" ]; then
            PRERELEASE=false
            NAME="MeshApp ${TAG}"
          else
            PRERELEASE=true
            NAME="MeshApp ${TAG} (unstable)"
          fi

          # Release notes из коммитов с предыдущего тега
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          else
            NOTES=$(git log --pretty=format:"- %s" -20)
          fi
          # Экранируем для JSON
          NOTES_JSON=$(echo "$NOTES" | jq -sR .)

          curl -sf -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${NAME}\",\"body\":${NOTES_JSON},\"draft\":true,\"prerelease\":${PRERELEASE}}" \
            "${API}/releases"

  build-linux:
    needs: create-release
    runs-on: ubuntu
    steps:
      - run: |
          git clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"

      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Download appimagetool
        run: |
          mkdir -p tools
          ARCH=$(uname -m)
          case "${ARCH}" in
            x86_64|amd64) APPIMAGE_ARCH=x86_64 ;;
            aarch64|arm64) APPIMAGE_ARCH=aarch64 ;;
            *)
              echo "Unsupported Linux architecture for AppImage: ${ARCH}" >&2
              exit 1
              ;;
          esac
          curl -fsSL \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage" \
            -o tools/appimagetool.AppImage
          chmod +x tools/appimagetool.AppImage

      - run: APPIMAGE_EXTRACT_AND_RUN=1 ./gradlew jpackage appImage flatpak -Pappimagetool="$PWD/tools/appimagetool.AppImage" --no-daemon

      - name: Upload to Gitea Release
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          RELEASE_ID=$(curl -sf \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${API}/releases/tags/${TAG}" | jq -r '.id')
          for file in build/jpackage/*.deb build/jpackage/*.AppImage build/jpackage/*.flatpak; do
            [ -f "$file" ] || continue
            echo "Uploading $(basename "$file")..."
            curl -sf -X POST \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "${API}/releases/${RELEASE_ID}/assets?name=$(basename "$file")"
          done

  build-windows:
    needs: create-release
    runs-on: windows
    steps:
      - shell: bash
        run: |
          git clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"

      - run: .\gradlew.bat jpackage --no-daemon

      - name: Upload to Gitea Release
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          RELEASE_ID=$(curl -sf \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${API}/releases/tags/${TAG}" | jq -r '.id')
          for file in build/jpackage/*.msi; do
            [ -f "$file" ] || continue
            echo "Uploading $(basename "$file")..."
            curl -sf -X POST \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "${API}/releases/${RELEASE_ID}/assets?name=$(basename "$file")"
          done

  build-macos:
    needs: create-release
    runs-on: macos
    steps:
      - run: |
          git clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"

      - run: ./gradlew jpackage --no-daemon

      - name: Upload to Gitea Release
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          RELEASE_ID=$(curl -sf \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${API}/releases/tags/${TAG}" | jq -r '.id')
          for file in build/jpackage/*.dmg; do
            [ -f "$file" ] || continue
            echo "Uploading $(basename "$file")..."
            curl -sf -X POST \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "${API}/releases/${RELEASE_ID}/assets?name=$(basename "$file")"
          done

  publish-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu
    steps:
      - name: Publish release (remove draft)
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          RELEASE_ID=$(curl -sf \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${API}/releases/tags/${TAG}" | jq -r '.id')
          curl -sf -X PATCH \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"draft":false}' \
            "${API}/releases/${RELEASE_ID}"
