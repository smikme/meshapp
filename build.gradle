def requireSelfUpdateCondition = { boolean condition, String message ->
	if (!condition) {
		throw new GradleException("verifySelfUpdatePackage: ${message}")
	}
}

def isValidEd25519PublicKey = { String keyText ->
	try {
		def normalized = keyText
			.replace('-----BEGIN PUBLIC KEY-----', '')
			.replace('-----END PUBLIC KEY-----', '')
			.replaceAll('\\s+', '')
		def encoded = java.util.Base64.decoder.decode(normalized)
		java.security.KeyFactory.getInstance('Ed25519')
			.generatePublic(new java.security.spec.X509EncodedKeySpec(encoded))
		return true
	} catch (Exception ignored) {
		return false
	}
}

def zipEntryNames = { File zipFile ->
	def names = []
	new java.util.zip.ZipFile(zipFile).withCloseable { zip ->
		names = zip.entries().collect { it.name }
	}
	return names
}

def jarContainsEntry = { File jarFile, String entryName ->
	def found = false
	new java.util.jar.JarFile(jarFile).withCloseable { jar ->
		found = jar.getEntry(entryName) != null
	}
	return found
}

def zipJarContainsEntry = { File zipFile, String zipJarEntryName, String jarEntryName ->
	def found = false
	new java.util.zip.ZipFile(zipFile).withCloseable { zip ->
		def zipEntry = zip.getEntry(zipJarEntryName)
		if (zipEntry == null) {
			return
		}
		zip.getInputStream(zipEntry).withCloseable { input ->
			new java.util.jar.JarInputStream(input).withCloseable { jar ->
				java.util.jar.JarEntry entry
				while (!found && (entry = jar.nextJarEntry) != null) {
					if (entry.name == jarEntryName) {
						found = true
					}
				}
			}
		}
	}
	return found
}

def findJarFileWithEntry = { File libDir, String entryName ->
	def jars = libDir.listFiles()?.findAll { it.isFile() && it.name.endsWith('.jar') }?.sort { it.name } ?: []
	return jars.find { jarContainsEntry(it, entryName) }
}

def findZipJarEntryWithEntry = { File zipFile, Collection<String> entries, String entryName ->
	return entries.find { name ->
		name.startsWith('lib/')
			&& name.endsWith('.jar')
			&& !name.startsWith('lib/fx/')
			&& zipJarContainsEntry(zipFile, name, entryName)
	}
}

def verifyJarSelfUpdateEntries = { File jarFile ->
	selfUpdateRequiredJarEntries.each { entry ->
		requireSelfUpdateCondition(
			jarContainsEntry(jarFile, entry),
			"${jarFile} is missing ${entry}"
		)
	}
}

def verifyZipJarSelfUpdateEntries = { File zipFile, String zipJarEntry ->
	selfUpdateRequiredJarEntries.each { entry ->
		requireSelfUpdateCondition(
			zipJarContainsEntry(zipFile, zipJarEntry, entry),
			"${zipFile}!/${zipJarEntry} is missing ${entry}"
		)
	}
}

tasks.register('verifySelfUpdatePackage') {
	dependsOn tasks.named('jpackage'), tasks.named('selfUpdateArchive')
	group = 'verification'
	description = 'Проверить native package и self-update payload до публикации релиза'

	doLast {
		def os = org.gradle.internal.os.OperatingSystem.current()
		def outputDir = layout.buildDirectory.dir('jpackage').get().asFile
		def installDir = layout.buildDirectory.dir("install/${applicationName}").get().asFile
		def installLibDir = new File(installDir, 'lib')
		def updatePublicKeyText = updatePublicKey.get()
		requireSelfUpdateCondition(updatePublicKeyText != null && !updatePublicKeyText.isBlank(),
			"MESHAPP_UPDATE_ED25519_PUBLIC_KEY or -PmeshappUpdateEd25519PublicKey is required")
		requireSelfUpdateCondition(isValidEd25519PublicKey(updatePublicKeyText),
			"MESHAPP_UPDATE_ED25519_PUBLIC_KEY must be an Ed25519 X.509 public key")
		requireSelfUpdateCondition(installLibDir.isDirectory(), "installDist lib directory not found: ${installLibDir}")
		def selectedReleaseVersionInfo = resolveReleaseVersionInfo()
		if (selectedReleaseVersionInfo != null) {
			requireSelfUpdateCondition(applicationVersion == selectedReleaseVersionInfo.tag,
				"applicationVersion ${applicationVersion} does not match selected release tag ${selectedReleaseVersionInfo.tag}")
		}

		def selfUpdateArchives = outputDir.listFiles()?.findAll {
			it.isFile() && it.name.endsWith('-selfupdate.zip')
		}?.sort { it.name } ?: []
		requireSelfUpdateCondition(selfUpdateArchives.size() == 1,
			"expected exactly one self-update zip in ${outputDir}, found ${selfUpdateArchives.size()}")
		def selfUpdateZip = selfUpdateArchives[0]
		def expectedSelfUpdateName =
			"MeshApp-${sanitizeArtifactVersion(applicationVersion)}-${resolveSelfUpdatePlatform()}-selfupdate.zip"
		requireSelfUpdateCondition(selfUpdateZip.name == expectedSelfUpdateName,
			"expected self-update archive ${expectedSelfUpdateName}, found ${selfUpdateZip.name}")
		def entries = zipEntryNames(selfUpdateZip)

		requireSelfUpdateCondition(!entries.any { it.contains('.app/') || it.endsWith('.app') },
			"${selfUpdateZip.name} must contain payload files, not an app bundle")
		requireSelfUpdateCondition(entries.any { it == 'lib/' || it.startsWith('lib/') },
			"${selfUpdateZip.name} does not contain lib/ payload")
		requireSelfUpdateCondition(entries.any { it.startsWith('lib/fx/javafx-') && it.endsWith('.jar') },
			"${selfUpdateZip.name} does not contain JavaFX platform jars under lib/fx/")
		requireSelfUpdateCondition(entries.any { it == 'lib/jSerialComm.dll' || it ==~ /lib\/jSerialComm-[0-9].*\.jar/ },
			"${selfUpdateZip.name} does not contain jSerialComm payload")

		def payloadJarEntry = findZipJarEntryWithEntry(
			selfUpdateZip,
			entries,
			'com/meshtastic/client/update/SelfUpdateLauncher.class'
		)
		requireSelfUpdateCondition(payloadJarEntry != null,
			"${selfUpdateZip.name} does not contain the MeshApp payload jar")
		verifyZipJarSelfUpdateEntries(selfUpdateZip, payloadJarEntry)

		def installAppJar = findJarFileWithEntry(
			installLibDir,
			'com/meshtastic/client/update/SelfUpdateLauncher.class'
		)
		requireSelfUpdateCondition(installAppJar != null,
			"installDist payload jar with SelfUpdateLauncher not found in ${installLibDir}")
		verifyJarSelfUpdateEntries(installAppJar)

		if (os.isMacOsX()) {
			def appDir = new File(outputDir, 'MeshApp.app')
			def appLibDir = new File(appDir, 'Contents/app')
			def runtimeJava = new File(appDir, 'Contents/runtime/Contents/Home/bin/java')
			requireSelfUpdateCondition(appDir.isDirectory(), "macOS app image not found: ${appDir}")
			requireSelfUpdateCondition(runtimeJava.isFile() && runtimeJava.canExecute(),
				"macOS runtime must contain executable bin/java for payload handoff: ${runtimeJava}")
			def packagedJar = findJarFileWithEntry(
				appLibDir,
				'com/meshtastic/client/update/SelfUpdateLauncher.class'
			)
			requireSelfUpdateCondition(packagedJar != null,
				"macOS app payload jar with SelfUpdateLauncher not found in ${appLibDir}")
			verifyJarSelfUpdateEntries(packagedJar)
			requireSelfUpdateCondition(jarContainsEntry(packagedJar, "${macOsJnaResourcePrefix()}/libmeshapp-serial.dylib"),
				"${packagedJar} is missing macOS serial native library resource")
			requireSelfUpdateCondition(jarContainsEntry(packagedJar, "${macOsJnaResourcePrefix()}/libmeshapp-tray.dylib"),
				"${packagedJar} is missing macOS tray native library resource")
			requireSelfUpdateCondition(outputDir.listFiles()?.any { it.isFile() && it.name.endsWith('.dmg') },
				"macOS DMG was not produced in ${outputDir}")
			executePackagingCommand(
				['codesign', '--verify', '--deep', '--strict', appDir.absolutePath],
				"verifySelfUpdatePackage: codesign verification failed for ${appDir.name}"
			)
		} else if (os.isLinux()) {
			requireSelfUpdateCondition(outputDir.listFiles()?.any { it.isFile() && it.name.endsWith('.deb') },
				"Linux DEB was not produced in ${outputDir}")
			def flatpakFiles = outputDir.listFiles()?.findAll {
				it.isFile() && it.name.endsWith('.flatpak')
			}?.sort { it.name } ?: []
			if (!flatpakFiles.isEmpty()) {
				def expectedFlatpakName =
					"MeshApp-${sanitizeArtifactVersion(applicationVersion)}-${resolveLinuxAppImageArch()}.flatpak"
				requireSelfUpdateCondition(flatpakFiles.any { it.name == expectedFlatpakName },
					"expected Flatpak bundle ${expectedFlatpakName}, found ${flatpakFiles*.name}")
			}
			requireSelfUpdateCondition(entries.contains('lib/libmeshapp-ble.so'),
				"${selfUpdateZip.name} is missing Linux BLE native library")
		} else if (os.isWindows()) {
			requireSelfUpdateCondition(outputDir.listFiles()?.any { it.isFile() && it.name.endsWith('.msi') },
				"Windows MSI was not produced in ${outputDir}")
			requireSelfUpdateCondition(entries.contains('lib/meshapp-ble.dll'),
				"${selfUpdateZip.name} is missing Windows BLE native library")
			requireSelfUpdateCondition(entries.contains('lib/jSerialComm.dll'),
				"${selfUpdateZip.name} is missing extracted Windows jSerialComm.dll")
		}

		logger.lifecycle("verifySelfUpdatePackage: verified ${selfUpdateZip.name}")
	}
}

// ============================================================
// jpackage: create a native installer.
// Windows: .msi, macOS: .dmg, Linux: .deb
// Usage: ./gradlew jpackage.
// ============================================================
tasks.register('jpackage') {
	dependsOn installDist
	group = 'distribution'
	description = 'Создать нативный инсталлятор через jpackage'

	doLast {
		def os = org.gradle.internal.os.OperatingSystem.current()
		def installDir = layout.buildDirectory.dir("install/${applicationName}").get().asFile
		def outputDir = layout.buildDirectory.dir("jpackage").get().asFile
		if (outputDir.exists()) outputDir.deleteDir()
		outputDir.mkdirs()
		def appVersion = resolvePackageVersion(os)

		def javaHome = resolvePackagingJavaHome()
		logger.lifecycle("jpackage: using Java runtime from ${javaHome}")

		def jpackageBin = os.isWindows()
			? "${javaHome}/bin/jpackage.exe"
			: "${javaHome}/bin/jpackage"

		def libDir = preparePackagingLibDir(os, installDir, new File(outputDir, 'input'))
		def jvmArgsList = buildPackagingJvmArgs()
		def jlinkOptions = buildPackagingJlinkOptions()

		// macOS: app-image -> copy Icon Composer resources -> DMG.
		def macBuild = os.isMacOsX()
		File linuxResourceDir = null

		if (os.isLinux()) {
			linuxResourceDir = prepareLinuxPackagingResources()
		}

		def args = [
			jpackageBin,
			'--type', os.isWindows() ? 'msi' : (macBuild ? 'app-image' : 'deb'),
			'--name', 'MeshApp',
			'--app-version', appVersion,
			'--vendor', 'Meshtastic',
			'--copyright', 'Copyright © Konstantin A. Smirnov',
			'--dest', outputDir.absolutePath,
			'--input', libDir.absolutePath,
			'--jlink-options', jlinkOptions,
			'--main-jar', applicationJarName,
			'--main-class', application.mainClass.get(),
		]

		jvmArgsList.each { arg ->
			args << '--java-options'
			args << arg
		}

		// Icon for jpackage; Windows uses .ico, macOS is replaced by the Icon Composer version.
		if (os.isWindows()) {
			def icoFile = file('src/main/resources/logo/MeshApp.ico')
			if (icoFile.exists()) {
				args << '--icon'
				args << icoFile.absolutePath
			}
		} else if (macBuild) {
			def icnsFile = file('src/main/resources/macos/MeshApp.icns')
			if (icnsFile.exists()) {
				args << '--icon'
				args << icnsFile.absolutePath
			}
		} else {
			def pngFile = file('src/main/resources/logo/icon_512.png')
			if (pngFile.exists()) {
				args << '--icon'
				args << pngFile.absolutePath
			}
		}

		if (os.isWindows()) {
			args << '--win-dir-chooser'
			args << '--win-shortcut'
			args << '--win-menu'
			args << '--win-upgrade-uuid'
			args << 'd5765678-89ab-4def-8123-456789abcdef'
		}

		if (!os.isWindows() && !macBuild) {
			args << '--linux-shortcut'
			if (linuxResourceDir != null) {
				args << '--resource-dir'
				args << linuxResourceDir.absolutePath
			}
		}

		if (macBuild) {
			args << '--mac-package-identifier'
			args << 'com.meshtastic.meshapp'
			args << '--mac-package-name'
			args << 'MeshApp'
		}

		// Step 1: create an app-image on macOS, or the final installer on Windows/Linux.
		def strArgs = args.collect { it.toString() }
		def proc1 = new ProcessBuilder(strArgs).redirectErrorStream(true).start()
		def proc1Output = proc1.inputStream.text
		proc1.waitFor()
		if (proc1Output) logger.lifecycle(proc1Output.trim())
		if (proc1.exitValue() != 0) throw new GradleException("jpackage failed with exit code ${proc1.exitValue()}")
		if (os.isLinux() && !macBuild) {
			// jpackage auto-detects Debian dependencies from the build host and appends
			// custom deps instead of replacing them. On Ubuntu 24.04+ this bakes in
			// t64 package names (libasound2t64, libgtk-3-0t64, etc.), which are not
			// installable as-is on older Ubuntu. Repack the .deb and widen those deps
			// to "old-name | new-name" alternatives.
			patchLinuxDebControl(outputDir)
		}

		// macOS step 2: patch Info.plist, copy Assets.car, and build DMG.
		if (macBuild) {
			def appDir = new File(outputDir, "MeshApp.app")
			def resourcesDir = new File(appDir, "Contents/Resources")

			// Add NSBluetoothAlwaysUsageDescription; without it macOS 10.15+
			// terminates the process when CBCentralManager initializes for BLE.
			def infoPlist = new File(appDir, "Contents/Info.plist")
			if (infoPlist.exists()) {
				def plistText = infoPlist.text
				if (!plistText.contains('NSBluetoothAlwaysUsageDescription')) {
					plistText = plistText.replace('</dict>', """\
 <key>NSBluetoothAlwaysUsageDescription</key>
 <string>MeshApp uses Bluetooth to connect to Meshtastic devices.</string>
</dict>""")
					infoPlist.text = plistText
					logger.lifecycle("jpackage: NSBluetoothAlwaysUsageDescription добавлен в Info.plist")
				}
			}

			// Assets.car contains the Icon Composer icon with style variants.
			def assetsCar = file('src/main/resources/macos/Assets.car')
			if (assetsCar.exists()) {
				java.nio.file.Files.copy(assetsCar.toPath(), new File(resourcesDir, assetsCar.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
				logger.lifecycle("jpackage: Assets.car скопирован в бандл")
			}

			normalizeMacBundleInstallNames(appDir, 'jpackage')

			// The release bundle must be self-contained: allow only @rpath/@loader_path
			// and Apple system libraries. Any /opt/homebrew, /usr/local, $HOME, etc. paths are forbidden.
			assertMacBundleSelfContained(appDir, 'jpackage')
			assertMacRuntimeJavaLauncher(appDir, 'jpackage')

			def entitlements = file('src/main/resources/macos/entitlements.plist')
			def macSigningConfig = resolveMacSigningConfig()
			def macNotarizationConfig = resolveMacNotarizationConfig()
			if (macNotarizationConfig != null && macSigningConfig == null) {
				throw new GradleException("macOS notarization requires Developer ID signing credentials")
			}

			if (macSigningConfig != null) {
				def signArgs = [
					jpackageBin,
					'--type', 'app-image',
					'--app-image', appDir.absolutePath
				]
				appendMacSigningOptions(signArgs, macSigningConfig, true, entitlements)
				executePackagingCommand(signArgs, "Developer ID signing failed for ${appDir.name}")
				executePackagingCommand(
					['codesign', '--verify', '--deep', '--strict', appDir.absolutePath],
					"Signature verification failed for ${appDir.name}"
				)
				logger.lifecycle("jpackage: Developer ID подпись применена к ${appDir.name}")
			} else {
				// Local fallback: ad-hoc signing avoids immediate launch failures,
				// but is not suitable for an internet-distributed DMG.
				adHocSignMacBundle(appDir, entitlements)
				logger.lifecycle("jpackage: ad-hoc подпись применена и верифицирована")
			}

			// Build the DMG.
			def dmgFile = new File(outputDir, "MeshApp-${appVersion}.dmg")
			if (dmgFile.exists()) dmgFile.delete()

			def dmgArgs = [
				jpackageBin,
				'--type', 'dmg',
				'--name', 'MeshApp',
				'--app-version', appVersion,
				'--app-image', appDir.absolutePath,
				'--dest', outputDir.absolutePath,
				'--mac-package-identifier', 'com.meshtastic.meshapp',
				'--mac-package-name', 'MeshApp'
			]
			appendMacSigningOptions(dmgArgs, macSigningConfig, false, entitlements)
			executePackagingCommand(dmgArgs, "jpackage DMG failed")
			if (!dmgFile.isFile()) {
				throw new GradleException("jpackage: DMG not found after build: ${dmgFile}")
			}
			if (macNotarizationConfig != null) {
				notarizeMacArtifact(dmgFile, macNotarizationConfig)
				logger.lifecycle("jpackage: DMG notarized and stapled")
			} else if (macSigningConfig != null) {
				logger.warn("jpackage: DMG signed with Developer ID but not notarized; Gatekeeper may still block downloaded builds")
			}
			logger.lifecycle("jpackage: DMG создан в ${outputDir}")
		}
	}
}

// ============================================================
// AppImage: create a portable Linux AppImage from the jpackage app-image.
// Usage: ./gradlew appImage [-Pappimagetool=/path/to/appimagetool.AppImage].
// ============================================================
tasks.register('appImage') {
	dependsOn installDist
	mustRunAfter tasks.named('jpackage')
	group = 'distribution'
	description = 'Собрать portable Linux AppImage'

	doLast {
		def os = org.gradle.internal.os.OperatingSystem.current()
		if (!os.isLinux()) {
			throw new GradleException('appImage task is supported only on Linux')
		}

		def installDir = layout.buildDirectory.dir("install/${applicationName}").get().asFile
		def outputDir = layout.buildDirectory.dir("jpackage").get().asFile
		def workDir = layout.buildDirectory.dir("appimage").get().asFile
		outputDir.mkdirs()

		def appImage = buildLinuxAppImage(installDir, workDir, 'appImage')
		def iconSource = appImage.iconFile
		def jpackageImageDir = appImage.imageDir

		def appDir = new File(workDir, 'MeshApp.AppDir')
		copyDirectory(jpackageImageDir, new File(appDir, 'usr'))

		def launcher = new File(appDir, 'usr/bin/MeshApp')
		if (!launcher.isFile()) {
			throw new GradleException("appImage: launcher not found in AppDir: ${launcher}")
		}

		def desktopSource = requirePackagingFile("${flatpakMetadataDir.path}/${flatpakDesktopFileName}", 'appImage')
		def desktopFile = new File(appDir, flatpakDesktopFileName)
		java.nio.file.Files.copy(
			desktopSource.toPath(),
			desktopFile.toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING
		)

		def shareApplicationsDir = new File(appDir, 'usr/share/applications')
		shareApplicationsDir.mkdirs()
		java.nio.file.Files.copy(
			desktopSource.toPath(),
			new File(shareApplicationsDir, flatpakDesktopFileName).toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING
		)

		def rootIcon = new File(appDir, "${flatpakAppId}.png")
		java.nio.file.Files.copy(
			iconSource.toPath(),
			rootIcon.toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING
		)
		java.nio.file.Files.copy(
			iconSource.toPath(),
			new File(appDir, '.DirIcon').toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING
		)

		def shareIconsDir = new File(appDir, 'usr/share/icons/hicolor/512x512/apps')
		shareIconsDir.mkdirs()
		java.nio.file.Files.copy(
			iconSource.toPath(),
			new File(shareIconsDir, "${flatpakAppId}.png").toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING
		)

		def appRun = new File(appDir, 'AppRun')
		appRun.text = '''\
#!/bin/sh
HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
exec "$HERE/usr/bin/MeshApp" "$@"
'''
		appRun.setExecutable(true, false)

		def appImageTool = resolveAppImageTool()
		if (appImageTool == null) {
			throw new GradleException('appImage: appimagetool not found. Add it to PATH or pass -Pappimagetool=/path/to/appimagetool.AppImage')
		}

		def artifactName = "MeshApp-${sanitizeArtifactVersion(applicationVersion)}-${resolveLinuxAppImageArch()}.AppImage"
		def appImageFile = new File(outputDir, artifactName)
		if (appImageFile.exists()) {
			appImageFile.delete()
		}

		def appImageProc = new ProcessBuilder(
			appImageTool.absolutePath,
			'--no-appstream',
			appDir.absolutePath,
			appImageFile.absolutePath
		).redirectErrorStream(true)
		def env = appImageProc.environment()
		env.put('ARCH', resolveLinuxAppImageArch())
		env.put('VERSION', applicationVersion)
		if (appImageTool.name.endsWith('.AppImage') && !env.containsKey('APPIMAGE_EXTRACT_AND_RUN')) {
			env.put('APPIMAGE_EXTRACT_AND_RUN', '1')
		}

		def appImageProcess = appImageProc.start()
		def appImageOutput = appImageProcess.inputStream.text
		appImageProcess.waitFor()
		if (appImageOutput) logger.lifecycle(appImageOutput.trim())
		if (appImageProcess.exitValue() != 0) {
			throw new GradleException("appImage: appimagetool failed with exit code ${appImageProcess.exitValue()}")
		}

		appImageFile.setExecutable(true, false)
		logger.lifecycle("appImage: AppImage создан в ${appImageFile}")
	}
}

// ============================================================
// Flatpak: create a sandboxed Linux bundle with flatpak-builder.
// Usage: ./gradlew flatpak.
// Requires flatpak, flatpak-builder, and the installed runtime/SDK.
// ============================================================
tasks.register('flatpak') {
	dependsOn installDist
	mustRunAfter tasks.named('jpackage')
	mustRunAfter tasks.named('appImage')
	group = 'distribution'
	description = 'Собрать Linux Flatpak bundle'

	doLast {
		def os = org.gradle.internal.os.OperatingSystem.current()
		if (!os.isLinux()) {
			throw new GradleException('flatpak task is supported only on Linux')
		}

		def installDir = layout.buildDirectory.dir("install/${applicationName}").get().asFile
		def outputDir = layout.buildDirectory.dir("jpackage").get().asFile
		def workDir = layout.buildDirectory.dir("flatpak").get().asFile
		if (workDir.exists()) {
			workDir.deleteDir()
		}
		workDir.mkdirs()
		outputDir.mkdirs()

		def flatpakRuntime = (findProperty('flatpakRuntime') ?: 'org.freedesktop.Platform').toString().trim()
		def flatpakRuntimeVersion = (findProperty('flatpakRuntimeVersion') ?: '25.08').toString().trim()
		def flatpakSdk = (findProperty('flatpakSdk') ?: 'org.freedesktop.Sdk').toString().trim()
		def flatpakBranch = (findProperty('flatpakBranch') ?: 'stable').toString().trim()
		def flatpakGpgSign = (findProperty('flatpakGpgSign') ?: '').toString().trim()
		def flatpakBuilder = resolveCommandExecutable('flatpakBuilder', 'FLATPAK_BUILDER', 'flatpak-builder', 'flatpak')
		def flatpakBin = resolveCommandExecutable('flatpakBin', 'FLATPAK_BIN', 'flatpak', 'flatpak')

		def appImage = buildLinuxAppImage(installDir, new File(workDir, 'app-image'), 'flatpak')
		def sourceDir = prepareFlatpakSources(workDir, appImage.imageDir, appImage.iconFile, appImage.appVersion)
		def manifestFile = new File(workDir, "${flatpakAppId}.json")
		writeFlatpakManifest(manifestFile, sourceDir, flatpakRuntime, flatpakRuntimeVersion, flatpakSdk)

		def repoDir = new File(workDir, 'repo')
		def buildDir = new File(workDir, 'builder')
		def flatpakBuilderArgs = [
			flatpakBuilder.absolutePath,
			"--arch=${resolveLinuxAppImageArch()}",
			'--force-clean',
			"--repo=${repoDir.absolutePath}",
			"--default-branch=${flatpakBranch}",
			buildDir.absolutePath,
			manifestFile.absolutePath
		]
		if (flatpakGpgSign) {
			flatpakBuilderArgs.add(1, "--gpg-sign=${flatpakGpgSign}")
		}
		executePackagingCommand(
			flatpakBuilderArgs,
			'flatpak: flatpak-builder failed'
		)

		def artifactName = "MeshApp-${sanitizeArtifactVersion(applicationVersion)}-${resolveLinuxAppImageArch()}.flatpak"
		def bundleFile = new File(outputDir, artifactName)
		if (bundleFile.exists()) {
			bundleFile.delete()
		}

		def flatpakBundleArgs = [
			flatpakBin.absolutePath,
			'build-bundle',
			"--arch=${resolveLinuxAppImageArch()}",
			repoDir.absolutePath,
			bundleFile.absolutePath,
			flatpakAppId,
			flatpakBranch
		]
		if (flatpakGpgSign) {
			flatpakBundleArgs.add(2, "--gpg-sign=${flatpakGpgSign}")
		}

		executePackagingCommand(
			flatpakBundleArgs,
			'flatpak: flatpak build-bundle failed'
		)

		logger.lifecycle("flatpak: Flatpak bundle создан в ${bundleFile}")
	}
}

// macOS: launch through the .app bundle so the app appears in Dock and Cmd+Tab.
if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
	tasks.register('runMac') {
		dependsOn classes
		group = 'application'
		description = 'Запуск на macOS через .app bundle (Dock + Cmd+Tab)'

		doLast {
			def appDir = layout.buildDirectory.dir("tmp/MeshApp.app").get().asFile
			def contentsDir = new File(appDir, "Contents")
			def macosDir = new File(contentsDir, "MacOS")
			def resourcesDir = new File(contentsDir, "Resources")
			macosDir.mkdirs()
			resourcesDir.mkdirs()

			// Copy the icon into the .app bundle.
			def icnsSource = file('src/main/resources/logo/MeshApp.icns')
			if (icnsSource.exists()) {
				java.nio.file.Files.copy(icnsSource.toPath(), new File(resourcesDir, icnsSource.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			}

			// Info.plist
			new File(contentsDir, "Info.plist").text = """\
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
  "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleName</key>
    <string>MeshApp</string>
    <key>CFBundleIdentifier</key>
    <string>com.meshtastic.meshapp</string>
    <key>CFBundleVersion</key>
    <string>1.0</string>
    <key>CFBundleExecutable</key>
    <string>run</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleIconFile</key>
    <string>MeshApp</string>
    <key>NSHighResolutionCapable</key>
    <true/>
    <key>NSBluetoothAlwaysUsageDescription</key>
    <string>MeshApp uses Bluetooth to connect to Meshtastic devices.</string>
</dict>
</plist>"""

			// Собрать classpath и module-path из Gradle
			def cpJars = []
			def fxJars = []
			sourceSets.main.runtimeClasspath.files.each { f ->
				if (f.name.startsWith('javafx-') && (f.name.contains('-mac') || f.name.contains('-aarch64'))) {
					fxJars << f.absolutePath
				} else {
					cpJars << f.absolutePath
				}
			}
			def cpStr = cpJars.join(':')
			def fxStr = fxJars.join(':')

			// Java из toolchain
			def javaLauncher = javaToolchains.launcherFor {
				languageVersion = JavaLanguageVersion.of(javaVersion)
			}.get()
			def javaPath = javaLauncher.executablePath.asFile.absolutePath

			def jvmArgsList = application.applicationDefaultJvmArgs
			def jvmArgsStr = jvmArgsList.collect { "    '${it}'" }.join(" \\\n")
			def appArgsList = []
			def gradleRunTask = tasks.findByName('run')
			if (gradleRunTask != null && gradleRunTask.hasProperty('args')) {
				appArgsList.addAll(gradleRunTask.args.collect { it.toString() })
			}

			def script = new File(macosDir, "run")
			script.text = """\
#!/bin/bash
exec '${javaPath}' \\
${jvmArgsStr} \\
    --module-path '${fxStr}' \\
    --add-modules javafx.controls \\
    -cp '${cpStr}' \\
    ${application.mainClass.get()} \\
    "\$@"
"""
			script.setExecutable(true)

			def signArgs = ['codesign', '--force', '--deep', '--sign', '-', appDir.absolutePath]
			def signProc = new ProcessBuilder(signArgs).redirectErrorStream(true).start()
			def signOut = signProc.inputStream.text
			signProc.waitFor()
			if (signOut) logger.lifecycle(signOut.trim())
			if (signProc.exitValue() != 0) {
				throw new GradleException("runMac codesign failed with exit code ${signProc.exitValue()}")
			}

			def verifyProc = new ProcessBuilder(
				'codesign', '--verify', '--deep', '--strict', appDir.absolutePath
			).redirectErrorStream(true).start()
			def verifyOut = verifyProc.inputStream.text
			verifyProc.waitFor()
			if (verifyOut) logger.lifecycle(verifyOut.trim())
			if (verifyProc.exitValue() != 0) {
				throw new GradleException("runMac signature verification failed with exit code ${verifyProc.exitValue()}")
			}

			// Запустить .app через 'open -W' (ждём завершения). Для отладочного
			// multi-instance режима нужен '-n', иначе macOS активирует уже
			// запущенный bundle и не передаст аргументы новому процессу.
			def openArgs = ['open']
			if (appArgsList.any { it == '--no-single-instance' || it == '--allow-multiple-instances' }) {
				openArgs << '-n'
			}
			openArgs << '-W'
			openArgs << appDir.absolutePath
			if (!appArgsList.isEmpty()) {
				openArgs << '--args'
				openArgs.addAll(appArgsList)
			}
			def proc = new ProcessBuilder(openArgs).start()
			proc.consumeProcessOutput(System.out, System.err)
			proc.waitFor()
		}
	}
}
