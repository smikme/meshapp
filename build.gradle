plugins {
	id 'java'
	id 'application'
	id 'org.graalvm.buildtools.native' version '0.10.6'
	id 'com.google.protobuf' version '0.9.4'
	id 'org.openjfx.javafxplugin' version '0.1.0'
}

application {
	mainClass = 'com.meshtastic.client.MeshApp'
	def jvmArgs = [
		'-Xmx256m',
		'-Xms256m',
		'--add-opens', 'javafx.graphics/javafx.stage=ALL-UNNAMED',
		'--add-opens', 'javafx.graphics/com.sun.javafx.tk=ALL-UNNAMED',
		'--add-opens', 'javafx.graphics/com.sun.javafx.tk.quantum=ALL-UNNAMED',
		'--add-opens', 'javafx.graphics/com.sun.glass.ui=ALL-UNNAMED'
	]
	if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
		jvmArgs += ['--add-opens', 'javafx.graphics/com.sun.glass.ui.win=ALL-UNNAMED']
	}
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		jvmArgs += ['--add-opens', 'javafx.graphics/com.sun.glass.ui.mac=ALL-UNNAMED']
	}
	applicationDefaultJvmArgs = jvmArgs
}

javafx {
	version = "21.0.7"
	modules = ['javafx.controls']
}

group = 'com.meshtastic'
version = {
	try {
		return 'git describe --tags --always --dirty'.execute().text.trim() ?: 'dev'
	} catch (ignored) {
		return 'dev'
	}
}()

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.google.protobuf:protobuf-java:4.33.4'
	implementation 'com.miglayout:miglayout-javafx:11.4.2'
	implementation 'ch.qos.logback:logback-classic:1.5.16'
	implementation 'com.fazecast:jSerialComm:2.11.0'
	implementation 'com.google.code.gson:gson:2.11.0'
	implementation 'com.h2database:h2:2.3.232'
	implementation 'io.github.mkpaz:atlantafx-base:2.1.0'
	implementation 'net.java.dev.jna:jna:5.16.0'
	implementation 'net.java.dev.jna:jna-platform:5.16.0'
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.testfx:openjfx-monocle:21.0.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
	protoc {
		artifact = 'com.google.protobuf:protoc:4.33.4'
	}
}

jar {
	manifest {
		attributes(
			'Implementation-Title': project.name,
			'Implementation-Version': project.version
		)
	}
	// Файлы только для jpackage/бандла — в jar не нужны
	exclude 'logo/MeshApp.icns', 'logo/MeshApp.ico'
	exclude 'macos/**'
}

// Генерация version.properties при каждой сборке
tasks.register('generateVersionProperties') {
	def outputDir = layout.buildDirectory.dir('generated/resources')
	outputs.dir(outputDir)
	// Всегда пересоздавать — версия может измениться (dirty/commit)
	outputs.upToDateWhen { false }
	doLast {
		def dir = outputDir.get().asFile
		dir.mkdirs()
		def versionCode = '0'
		try {
			versionCode = 'git rev-list --count HEAD'.execute().text.trim() ?: '0'
		} catch (ignored) {}
		new File(dir, 'version.properties').text =
			"version=${project.version}\nversionCode=${versionCode}\n"
	}
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/resources'))
tasks.named('processResources') { dependsOn 'generateVersionProperties' }

def macOsJnaResourcePrefix = {
	def arch = System.getProperty('os.arch').toLowerCase(java.util.Locale.ROOT)
	switch (arch) {
		case ['amd64', 'x86_64']:
			return 'darwin-x86-64'
		case ['aarch64', 'arm64']:
			return 'darwin-aarch64'
		default:
			return "darwin-${arch}"
	}
}

// ============================================================
// macOS Serial: сборка libmeshapp-serial.dylib для безопасного ioctl wrapper
// Использование: ./gradlew buildSerialNative (или автоматически при processResources на macOS)
// ============================================================
if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
	tasks.register('buildSerialNative') {
		group = 'build'
		description = 'Собрать libmeshapp-serial.dylib для macOS serial modem-line control'

		def nativeDir = file('native/macos-serial')
		def resourcePrefix = macOsJnaResourcePrefix()
		def outputDir = layout.buildDirectory.dir("generated/resources/${resourcePrefix}").get().asFile
		def dylibDest = new File(outputDir, 'libmeshapp-serial.dylib')

		inputs.files(fileTree(nativeDir) { include '*.c', '*.h' })
		outputs.file(dylibDest)

		doLast {
			outputDir.mkdirs()
			def compile = new ProcessBuilder(
				'cc',
				'-dynamiclib',
				'-std=c11',
				'-O2',
				'-Wall',
				'-Wextra',
				'-fvisibility=hidden',
				'meshapp_serial.c',
				'-o', dylibDest.absolutePath
			).directory(nativeDir).redirectErrorStream(true).start()
			def compileOutput = compile.inputStream.text
			compile.waitFor()
			if (compileOutput) logger.lifecycle(compileOutput.trim())
			if (compile.exitValue() != 0) {
				throw new GradleException("macOS serial native build failed (exit ${compile.exitValue()})")
			}
			logger.lifecycle("buildSerialNative: dylib собран в ${dylibDest}")
		}
	}
	tasks.named('processResources') { dependsOn 'buildSerialNative' }

	tasks.register('buildTrayNative') {
		group = 'build'
		description = 'Собрать libmeshapp-tray.dylib для macOS status item'

		def nativeDir = file('native/macos-tray')
		def resourcePrefix = macOsJnaResourcePrefix()
		def outputDir = layout.buildDirectory.dir("generated/resources/${resourcePrefix}").get().asFile
		def dylibDest = new File(outputDir, 'libmeshapp-tray.dylib')

		inputs.files(fileTree(nativeDir) { include '*.m', '*.h' })
		outputs.file(dylibDest)

		doLast {
			outputDir.mkdirs()

			def javaLauncher = javaToolchains.launcherFor {
				languageVersion = JavaLanguageVersion.of(21)
			}.get()
			def javaHome = javaLauncher.executablePath.asFile.parentFile.parentFile.absolutePath

			def compile = new ProcessBuilder(
				'cc',
				'-dynamiclib',
				'-fobjc-arc',
				'-fblocks',
				'-O2',
				'-Wall',
				'-Wextra',
				'-fvisibility=hidden',
				'-I', "${javaHome}/include",
				'-I', "${javaHome}/include/darwin",
				'-framework', 'Cocoa',
				'meshapp_tray.m',
				'-o', dylibDest.absolutePath
			).directory(nativeDir).redirectErrorStream(true).start()
			def compileOutput = compile.inputStream.text
			compile.waitFor()
			if (compileOutput) logger.lifecycle(compileOutput.trim())
			if (compile.exitValue() != 0) {
				throw new GradleException("macOS tray native build failed (exit ${compile.exitValue()})")
			}
			logger.lifecycle("buildTrayNative: dylib собран в ${dylibDest}")
		}
	}
	tasks.named('processResources') { dependsOn 'buildTrayNative' }
}

// ============================================================
// Windows BLE: сборка meshapp-ble.dll из native/windows-ble/
// Использование: ./gradlew buildBleNative (или автоматически при processResources на Windows)
// ============================================================
if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
	tasks.register('buildBleNative') {
		group = 'build'
		description = 'Собрать meshapp-ble.dll (WinRT BLE) через CMake'

		def nativeDir = file('native/windows-ble')
		def buildDir = new File(nativeDir, 'build')
		def dllOutput = new File(buildDir, 'Release/meshapp-ble.dll')
		def dllDest = file('src/main/resources/win32-x86-64/meshapp-ble.dll')

		inputs.files(fileTree(nativeDir) { include '*.cpp', '*.h', 'CMakeLists.txt' })
		outputs.file(dllDest)

		doLast {
			// CMake configure
			if (!new File(buildDir, 'CMakeCache.txt').exists()) {
				def cfg = new ProcessBuilder('cmake', '-B', 'build', '-A', 'x64')
					.directory(nativeDir).redirectErrorStream(true).start()
				def cfgOut = cfg.inputStream.text
				cfg.waitFor()
				if (cfgOut) logger.lifecycle(cfgOut.trim())
				if (cfg.exitValue() != 0) throw new GradleException("CMake configure failed (exit ${cfg.exitValue()})")
			}
			// CMake build
			def bld = new ProcessBuilder('cmake', '--build', 'build', '--config', 'Release')
				.directory(nativeDir).redirectErrorStream(true).start()
			def bldOut = bld.inputStream.text
			bld.waitFor()
			if (bldOut) logger.lifecycle(bldOut.trim())
			if (bld.exitValue() != 0) throw new GradleException("CMake build failed (exit ${bld.exitValue()})")
			// Copy DLL to resources
			dllDest.parentFile.mkdirs()
			java.nio.file.Files.copy(
				dllOutput.toPath(), dllDest.toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING
			)
			logger.lifecycle("buildBleNative: DLL скопирован в ${dllDest}")
		}
	}
	tasks.named('processResources') { dependsOn 'buildBleNative' }
}

// ============================================================
// Linux BLE: сборка libmeshapp-ble.so из native/linux-ble/
// Использование: ./gradlew buildBleNative (или автоматически при processResources на Linux)
// Требует: libsystemd-dev (Ubuntu/Debian) или systemd-devel (Fedora/RHEL)
// ============================================================
if (org.gradle.internal.os.OperatingSystem.current().isLinux()) {
	tasks.register('buildBleNative') {
		group = 'build'
		description = 'Собрать libmeshapp-ble.so (BlueZ BLE) через CMake'

		def nativeDir = file('native/linux-ble')
		def buildDir = new File(nativeDir, 'build')
		def soOutput = new File(buildDir, 'libmeshapp-ble.so')
		def soDest = file('src/main/resources/linux-x86-64/libmeshapp-ble.so')

		inputs.files(fileTree(nativeDir) { include '*.c', '*.h', 'CMakeLists.txt' })
		outputs.file(soDest)

		doLast {
			// CMake configure
			if (!new File(buildDir, 'CMakeCache.txt').exists()) {
				def cfg = new ProcessBuilder('cmake', '-B', 'build', '-DCMAKE_BUILD_TYPE=Release')
					.directory(nativeDir).redirectErrorStream(true).start()
				def cfgOut = cfg.inputStream.text
				cfg.waitFor()
				if (cfgOut) logger.lifecycle(cfgOut.trim())
				if (cfg.exitValue() != 0) throw new GradleException("CMake configure failed (exit ${cfg.exitValue()})")
			}
			// CMake build
			def bld = new ProcessBuilder('cmake', '--build', 'build')
				.directory(nativeDir).redirectErrorStream(true).start()
			def bldOut = bld.inputStream.text
			bld.waitFor()
			if (bldOut) logger.lifecycle(bldOut.trim())
			if (bld.exitValue() != 0) throw new GradleException("CMake build failed (exit ${bld.exitValue()})")
			// Copy SO to resources
			soDest.parentFile.mkdirs()
			java.nio.file.Files.copy(
				soOutput.toPath(), soDest.toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING
			)
			logger.lifecycle("buildBleNative: SO скопирован в ${soDest}")
		}
	}
	tasks.named('processResources') { dependsOn 'buildBleNative' }
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
	if (org.gradle.internal.os.OperatingSystem.current().isLinux()
			&& !System.getenv('DISPLAY')?.trim()
			&& !System.getenv('WAYLAND_DISPLAY')?.trim()) {
		systemProperty 'java.awt.headless', 'true'
		systemProperty 'glass.platform', 'Monocle'
		systemProperty 'monocle.platform', 'Headless'
		systemProperty 'prism.order', 'sw'
		systemProperty 'testfx.robot', 'glass'
		systemProperty 'testfx.headless', 'true'
	}
}

// ============================================================
// JavaDoc: генерация документации в docs/javadoc/
// Использование: ./gradlew javadoc
// ============================================================
javadoc {
	destinationDir = file("${projectDir}/docs/javadoc")
	options.encoding = 'UTF-8'
	options.charSet = 'UTF-8'
	options.docEncoding = 'UTF-8'
	options.locale = 'ru'
	options.windowTitle = "MeshApp ${project.version} API"
	options.docTitle = "MeshApp — Meshtastic Desktop Client"
	options.header = "MeshApp ${project.version}"
	options.links('https://docs.oracle.com/en/java/javase/21/docs/api/')
	// Не падать при предупреждениях (protobuf-generated классы и т.д.)
	options.addBooleanOption('Xdoclint:none', true)
	// Исключить protobuf-generated классы из документации
	exclude 'org/meshtastic/proto/**'
	failOnError = false
}
tasks.named("run") {
	outputs.upToDateWhen { false }
	// macOS: перенаправить на runMac для отображения в Dock и Cmd+Tab
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		dependsOn 'runMac'
		// Отключить саму JavaExec — приложение запускается через runMac
		enabled = false
	}
}

// ============================================================
// jpackage: создание нативного инсталлятора
// Windows: .msi, macOS: .dmg, Linux: .deb/.rpm
// Использование: ./gradlew jpackage
// ============================================================
tasks.register('jpackage') {
	dependsOn installDist
	group = 'distribution'
	description = 'Создать нативный инсталлятор через jpackage'

	doLast {
		def os = org.gradle.internal.os.OperatingSystem.current()
		def installDir = layout.buildDirectory.dir("install/${project.name}").get().asFile
		def outputDir = layout.buildDirectory.dir("jpackage").get().asFile
		if (outputDir.exists()) outputDir.deleteDir()
		outputDir.mkdirs()
		def appVersion = {
			try {
				def count = 'git rev-list --count HEAD'.execute().text.trim()
				if (os.isMacOsX()) {
					// macOS jpackage allows 1-3 numbers only
					return "1.2.${count}"
				}
				def hash = 'git rev-parse --short=4 HEAD'.execute().text.trim()
				// Доп. разряд из хеша (0-65535) — чтобы MSI всегда считал версию новой
				def minor = Integer.parseInt(hash, 16) % 65536
				return "1.2.${count}.${minor}"
			} catch (ignored) {
				return os.isMacOsX() ? '1.2.0' : '1.2.0.0'
			}
		}()

		def javaHome = javaToolchains.launcherFor {
			languageVersion = JavaLanguageVersion.of(21)
		}.get().executablePath.asFile.parentFile.parentFile.absolutePath

		def jpackageBin = os.isWindows()
			? "${javaHome}/bin/jpackage.exe"
			: "${javaHome}/bin/jpackage"

		def libDir = new File(installDir, "lib")

		// Выделить JavaFX JAR в поддиректорию — только они должны быть на module path.
		// Если $APPDIR целиком на module path, app JAR становится automatic module,
		// и --add-opens ...=ALL-UNNAMED перестаёт действовать (рефлексия для HWND ломается).
		def fxDir = new File(libDir, "fx")
		fxDir.mkdirs()
		libDir.listFiles()?.findAll { it.name.startsWith('javafx-') }?.each { jar ->
			java.nio.file.Files.move(jar.toPath(), new File(fxDir, jar.name).toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}

		// Windows: скопировать meshapp-ble.dll (WinRT BLE) в lib/ для jpackage
		if (os.isWindows()) {
			def bleDll = file('src/main/resources/win32-x86-64/meshapp-ble.dll')
			if (bleDll.exists()) {
				java.nio.file.Files.copy(bleDll.toPath(),
					new File(libDir, bleDll.name).toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
				logger.lifecycle("jpackage: meshapp-ble.dll скопирован в lib/")
			}
		}

		// Linux: скопировать libmeshapp-ble.so (BlueZ BLE) в lib/ для jpackage
		if (os.isLinux()) {
			def bleSo = file('src/main/resources/linux-x86-64/libmeshapp-ble.so')
			if (bleSo.exists()) {
				java.nio.file.Files.copy(bleSo.toPath(),
					new File(libDir, bleSo.name).toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
				logger.lifecycle("jpackage: libmeshapp-ble.so скопирован в lib/")
			}
		}

		def jvmArgsList = application.applicationDefaultJvmArgs.collect()
		// $APPDIR — токен jpackage, заменяется на реальную директорию приложения при запуске.
		// Абсолютные пути билд-машины не работают на других компьютерах.
		// $APPDIR/fx — только JavaFX модули, app остаётся на classpath (unnamed module).
		jvmArgsList << "--module-path"
		jvmArgsList << '$APPDIR/fx'
		jvmArgsList << "--add-modules"
		jvmArgsList << "javafx.controls"

		// macOS: app-image → копируем Icon Composer ресурсы → DMG
		def macBuild = os.isMacOsX()
		File linuxResourceDir = null

		if (os.isLinux()) {
			linuxResourceDir = layout.buildDirectory.dir("jpackage/linux-resources").get().asFile
			if (linuxResourceDir.exists()) {
				linuxResourceDir.deleteDir()
			}
			linuxResourceDir.mkdirs()

			def linuxLauncherIcon = new File(linuxResourceDir, 'MeshApp.png')
			java.nio.file.Files.copy(
				file('src/main/resources/logo/icon_512.png').toPath(),
				linuxLauncherIcon.toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING
			)

			def linuxScriptsDir = file('src/jpackage/linux')
			['postinstall', 'postrm'].each { scriptName ->
				def source = new File(linuxScriptsDir, scriptName)
				if (source.exists()) {
					def target = new File(linuxResourceDir, scriptName)
					java.nio.file.Files.copy(
						source.toPath(),
						target.toPath(),
						java.nio.file.StandardCopyOption.REPLACE_EXISTING
					)
					target.setExecutable(true, false)
				}
			}
		}

		def args = [
			jpackageBin,
			'--type', os.isWindows() ? 'msi' : (macBuild ? 'app-image' : 'deb'),
			'--name', 'MeshApp',
			'--app-version', appVersion,
			'--vendor', 'Meshtastic',
			'--copyright', 'Copyright © Konstantin A. Smirnov',
			'--dest', outputDir.absolutePath,
			'--input', libDir.absolutePath,
			'--main-jar', "${project.name}-${project.version}.jar",
			'--main-class', application.mainClass.get(),
		]

		jvmArgsList.each { arg ->
			args << '--java-options'
			args << arg
		}

		// Иконка для jpackage (Windows .ico, macOS — заменяется Icon Composer версией)
		if (os.isWindows()) {
			def icoFile = file('src/main/resources/logo/MeshApp.ico')
			if (icoFile.exists()) {
				args << '--icon'
				args << icoFile.absolutePath
			}
		} else if (macBuild) {
			def icnsFile = file('src/main/resources/macos/MeshApp.icns')
			if (icnsFile.exists()) {
				args << '--icon'
				args << icnsFile.absolutePath
			}
		} else {
			def pngFile = file('src/main/resources/logo/icon_512.png')
			if (pngFile.exists()) {
				args << '--icon'
				args << pngFile.absolutePath
			}
		}

		if (os.isWindows()) {
			args << '--win-dir-chooser'
			args << '--win-shortcut'
			args << '--win-menu'
			args << '--win-upgrade-uuid'
			args << 'd5765678-89ab-4def-8123-456789abcdef'
		}

		if (!os.isWindows() && !macBuild) {
			// Ubuntu 24.04+ переименовал libasound2 → libasound2t64 (64-bit time_t).
			// jpackage по умолчанию добавляет libasound2, что ломает установку.
			// Указываем libasound2t64 | libasound2 для совместимости со старыми и новыми дистрибутивами.
			args << '--linux-package-deps'
			args << 'libasound2t64 | libasound2'
			args << '--linux-shortcut'
			if (linuxResourceDir != null) {
				args << '--resource-dir'
				args << linuxResourceDir.absolutePath
			}
		}

		if (macBuild) {
			args << '--mac-package-identifier'
			args << 'com.meshtastic.meshapp'
			args << '--mac-package-name'
			args << 'MeshApp'
		}

		// Шаг 1: создать app-image (macOS) или финальный инсталлятор (Windows/Linux)
		def strArgs = args.collect { it.toString() }
		def proc1 = new ProcessBuilder(strArgs).redirectErrorStream(true).start()
		def proc1Output = proc1.inputStream.text
		proc1.waitFor()
		if (proc1Output) logger.lifecycle(proc1Output.trim())
		if (proc1.exitValue() != 0) throw new GradleException("jpackage failed with exit code ${proc1.exitValue()}")

		// macOS шаг 2: патчить Info.plist, скопировать Assets.car, собрать DMG
		if (macBuild) {
			def appDir = new File(outputDir, "MeshApp.app")
			def resourcesDir = new File(appDir, "Contents/Resources")

			// Добавить NSBluetoothAlwaysUsageDescription — без него macOS 10.15+
			// убивает процесс при инициализации CBCentralManager (BLE)
			def infoPlist = new File(appDir, "Contents/Info.plist")
			if (infoPlist.exists()) {
				def plistText = infoPlist.text
				if (!plistText.contains('NSBluetoothAlwaysUsageDescription')) {
					plistText = plistText.replace('</dict>', """\
 <key>NSBluetoothAlwaysUsageDescription</key>
 <string>MeshApp uses Bluetooth to connect to Meshtastic devices.</string>
</dict>""")
					infoPlist.text = plistText
					logger.lifecycle("jpackage: NSBluetoothAlwaysUsageDescription добавлен в Info.plist")
				}
			}

			// Assets.car содержит иконку из Icon Composer с вариантами стилей
			def assetsCar = file('src/main/resources/macos/Assets.car')
			if (assetsCar.exists()) {
				java.nio.file.Files.copy(assetsCar.toPath(), new File(resourcesDir, assetsCar.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
				logger.lifecycle("jpackage: Assets.car скопирован в бандл")
			}

			// Ad-hoc подпись (inside-out): после патча Info.plist и Assets.car
			// подпись jpackage сломана — переподписываем каждый компонент отдельно.
			// Без Developer ID пользователи увидят «неизвестный разработчик»
			// и смогут открыть через правый клик → Открыть.
			def entitlements = file('src/main/resources/macos/entitlements.plist')

			def signFile = { File target, boolean withEntitlements ->
				def signArgs = ['codesign', '--force', '--sign', '-', '--timestamp=none']
				if (withEntitlements && entitlements.exists()) {
					signArgs << '--entitlements'
					signArgs << entitlements.absolutePath
				}
				signArgs << target.absolutePath
				def p = new ProcessBuilder(signArgs).redirectErrorStream(true).start()
				def out = p.inputStream.text
				p.waitFor()
				if (p.exitValue() != 0) {
					throw new GradleException("codesign failed for ${target.name}: ${out}")
				}
			}

			// 1. Подписать все dylib/jnilib в runtime (рекурсивно)
			def runtimeLib = new File(appDir, 'Contents/runtime/Contents/Home/lib')
			if (runtimeLib.exists()) {
				runtimeLib.eachFileRecurse { f ->
					if (f.name.endsWith('.dylib') || f.name.endsWith('.jnilib')) {
						signFile(f, false)
					}
				}
			}

			// 2. Подписать libjli.dylib в runtime/Contents/MacOS
			def runtimeMacOs = new File(appDir, 'Contents/runtime/Contents/MacOS')
			if (runtimeMacOs.exists()) {
				runtimeMacOs.listFiles()?.each { f ->
					if (f.name.endsWith('.dylib')) {
						signFile(f, false)
					}
				}
			}

			// 3. Подписать sub-bundle runtime
			def runtimeBundle = new File(appDir, 'Contents/runtime')
			if (runtimeBundle.exists()) {
				signFile(runtimeBundle, false)
			}

			// 4. Подписать главный исполняемый файл (с entitlements для JIT)
			def mainExe = new File(appDir, 'Contents/MacOS/MeshApp')
			if (mainExe.exists()) {
				signFile(mainExe, true)
			}

			// 5. Подписать .app бандл (с entitlements)
			signFile(appDir, true)

			// 6. Верификация
			def verifyProc = new ProcessBuilder(
				'codesign', '--verify', '--deep', '--strict', appDir.absolutePath
			).redirectErrorStream(true).start()
			def verifyOut = verifyProc.inputStream.text
			verifyProc.waitFor()
			if (verifyProc.exitValue() != 0) {
				throw new GradleException("Signature verification failed: ${verifyOut}")
			}
			logger.lifecycle("jpackage: ad-hoc подпись применена и верифицирована")

			// Собрать DMG
			def dmgFile = new File(outputDir, "MeshApp-${appVersion}.dmg")
			if (dmgFile.exists()) dmgFile.delete()

			def dmgArgs = [
				jpackageBin,
				'--type', 'dmg',
				'--name', 'MeshApp',
				'--app-version', appVersion,
				'--app-image', appDir.absolutePath,
				'--dest', outputDir.absolutePath,
				'--mac-package-identifier', 'com.meshtastic.meshapp',
				'--mac-package-name', 'MeshApp'
			]
			def proc2 = new ProcessBuilder(dmgArgs.collect { it.toString() }).redirectErrorStream(true).start()
			def proc2Output = proc2.inputStream.text
			proc2.waitFor()
			if (proc2Output) logger.lifecycle(proc2Output.trim())
			if (proc2.exitValue() != 0) throw new GradleException("jpackage DMG failed with exit code ${proc2.exitValue()}")
			logger.lifecycle("jpackage: DMG создан в ${outputDir}")
		}
	}
}

// macOS: запуск через .app bundle для отображения в Dock и Cmd+Tab
if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
	tasks.register('runMac') {
		dependsOn classes
		group = 'application'
		description = 'Запуск на macOS через .app bundle (Dock + Cmd+Tab)'

		doLast {
			def appDir = layout.buildDirectory.dir("tmp/MeshApp.app").get().asFile
			def contentsDir = new File(appDir, "Contents")
			def macosDir = new File(contentsDir, "MacOS")
			def resourcesDir = new File(contentsDir, "Resources")
			macosDir.mkdirs()
			resourcesDir.mkdirs()

			// Скопировать иконку в .app bundle
			def icnsSource = file('src/main/resources/logo/MeshApp.icns')
			if (icnsSource.exists()) {
				java.nio.file.Files.copy(icnsSource.toPath(), new File(resourcesDir, icnsSource.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			}

			// Info.plist
			new File(contentsDir, "Info.plist").text = """\
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
  "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleName</key>
    <string>MeshApp</string>
    <key>CFBundleIdentifier</key>
    <string>com.meshtastic.meshapp</string>
    <key>CFBundleVersion</key>
    <string>1.0</string>
    <key>CFBundleExecutable</key>
    <string>run</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleIconFile</key>
    <string>MeshApp</string>
    <key>NSHighResolutionCapable</key>
    <true/>
    <key>NSBluetoothAlwaysUsageDescription</key>
    <string>MeshApp uses Bluetooth to connect to Meshtastic devices.</string>
</dict>
</plist>"""

			// Собрать classpath и module-path из Gradle
			def cpJars = []
			def fxJars = []
			sourceSets.main.runtimeClasspath.files.each { f ->
				if (f.name.startsWith('javafx-') && (f.name.contains('-mac') || f.name.contains('-aarch64'))) {
					fxJars << f.absolutePath
				} else {
					cpJars << f.absolutePath
				}
			}
			def cpStr = cpJars.join(':')
			def fxStr = fxJars.join(':')

			// Java из toolchain
			def javaLauncher = javaToolchains.launcherFor {
				languageVersion = JavaLanguageVersion.of(21)
			}.get()
			def javaPath = javaLauncher.executablePath.asFile.absolutePath

			def jvmArgsList = application.applicationDefaultJvmArgs
			def jvmArgsStr = jvmArgsList.collect { "    '${it}'" }.join(" \\\n")

			def script = new File(macosDir, "run")
			script.text = """\
#!/bin/bash
exec '${javaPath}' \\
${jvmArgsStr} \\
    --module-path '${fxStr}' \\
    --add-modules javafx.controls \\
    -cp '${cpStr}' \\
    ${application.mainClass.get()}
"""
			script.setExecutable(true)

			def signArgs = ['codesign', '--force', '--deep', '--sign', '-', appDir.absolutePath]
			def signProc = new ProcessBuilder(signArgs).redirectErrorStream(true).start()
			def signOut = signProc.inputStream.text
			signProc.waitFor()
			if (signOut) logger.lifecycle(signOut.trim())
			if (signProc.exitValue() != 0) {
				throw new GradleException("runMac codesign failed with exit code ${signProc.exitValue()}")
			}

			def verifyProc = new ProcessBuilder(
				'codesign', '--verify', '--deep', '--strict', appDir.absolutePath
			).redirectErrorStream(true).start()
			def verifyOut = verifyProc.inputStream.text
			verifyProc.waitFor()
			if (verifyOut) logger.lifecycle(verifyOut.trim())
			if (verifyProc.exitValue() != 0) {
				throw new GradleException("runMac signature verification failed with exit code ${verifyProc.exitValue()}")
			}

			// Запустить .app через 'open -W' (ждём завершения)
			def proc = ['open', '-W', appDir.absolutePath].execute()
			proc.consumeProcessOutput(System.out, System.err)
			proc.waitFor()
		}
	}
}
