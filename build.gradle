def resolveReleasePackageVersion = {
	return resolveReleaseVersionInfo()?.packageVersion
}

def resolvePackageVersion = { os ->
	def releasePackageVersion = resolveReleasePackageVersion()
	if (releasePackageVersion != null) {
		return releasePackageVersion
	}
	try {
		def count = 'git rev-list --count HEAD'.execute().text.trim()
		if (os.isMacOsX()) {
			// macOS jpackage allows 1-3 numbers only
			return "2.0.${count}"
		}
		def hash = 'git rev-parse --short=4 HEAD'.execute().text.trim()
		// Fallback for dev builds without a release tag; MSI upgrades still use
		// the first three version components.
		def minor = Integer.parseInt(hash, 16) % 65536
		return "2.0.${count}.${minor}"
	} catch (ignored) {
		return os.isMacOsX() ? '2.0.0' : '2.0.0.0'
	}
}

def resolveFlatpakReleaseDate = {
	def configuredDate = (
		findProperty('flatpakReleaseDate')
			?: System.getenv('FLATPAK_RELEASE_DATE')
			?: System.getenv('MESHAPP_RELEASE_DATE')
	)?.toString()?.trim()
	if (configuredDate) {
		if (!(configuredDate ==~ /\d{4}-\d{2}-\d{2}/)) {
			throw new GradleException(
				"flatpak release date must use YYYY-MM-DD format, got '${configuredDate}'")
		}
		return configuredDate
	}
	return LocalDate.now(ZoneOffset.UTC).toString()
}

def resolvePackagingJavaHome = {
	def configuredJavaHome = (findProperty('packagingJavaHome') ?: System.getenv('PACKAGING_JAVA_HOME'))
		?.toString()
		?.trim()
	if (configuredJavaHome) {
		def configured = file(configuredJavaHome)
		if (!configured.isDirectory()) {
			throw new GradleException(
				"packaging: configured packagingJavaHome/PACKAGING_JAVA_HOME not found: ${configured}"
			)
		}
		return configured.absolutePath
	}

	return javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}.get().executablePath.asFile.parentFile.parentFile.absolutePath
}

def buildPackagingJvmArgs = {
	def jvmArgsList = application.applicationDefaultJvmArgs.collect()
	// $APPDIR is a jpackage/AppImage token replaced with the real application directory at launch.
	// Absolute paths from the build machine do not work on other computers.
	// $APPDIR/fx contains only JavaFX modules; the app remains on the classpath as an unnamed module.
	jvmArgsList << "--module-path"
	jvmArgsList << '$APPDIR/fx'
	jvmArgsList << "--add-modules"
	jvmArgsList << "javafx.controls"
	jvmArgsList << "-DjSerialComm.library.path=\$APPDIR"
	return jvmArgsList
}

def buildPackagingJlinkOptions = {
	[
		'--strip-debug',
		'--no-man-pages',
		'--no-header-files',
		'--vm', 'server'
	].join(' ')
}

def relocateJavaFxJars = { File libDir ->
	def fxDir = new File(libDir, "fx")
	fxDir.mkdirs()
	libDir.listFiles()?.findAll { it.name.startsWith('javafx-') }?.each { jar ->
		java.nio.file.Files.move(
			jar.toPath(),
			new File(fxDir, jar.name).toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING
		)
	}
}

def patchUnixStartScriptForJavaFx = { File scriptFile ->
	if (!scriptFile.isFile()) {
		return
	}

	def lines = scriptFile.readLines('UTF-8')
	def patched = lines.collectMany { line ->
		if (line.startsWith('CLASSPATH=')) {
			def entries = line.substring('CLASSPATH='.length())
				.split(java.util.regex.Pattern.quote(File.pathSeparator))
				.findAll { !it.contains('/javafx-') }
			return ["CLASSPATH=${entries.join(File.pathSeparator)}"]
		}
		if (line == '        -classpath "$CLASSPATH" \\') {
			return [
				'        --module-path "$APP_HOME/lib/fx" \\',
				'        --add-modules javafx.controls \\',
				line
			]
		}
		return [line]
	}

	scriptFile.setText(patched.join('\n') + '\n', 'UTF-8')
}

def patchWindowsStartScriptForJavaFx = { File scriptFile ->
	if (!scriptFile.isFile()) {
		return
	}

	def lines = scriptFile.readLines('UTF-8')
	def patched = lines.collect { line ->
		if (line.startsWith('set CLASSPATH=')) {
			def entries = line.substring('set CLASSPATH='.length())
				.split(java.util.regex.Pattern.quote(';'))
				.findAll { !it.toLowerCase(java.util.Locale.ROOT).contains('\\lib\\javafx-') }
			return "set CLASSPATH=${entries.join(';')}"
		}
		if (line.startsWith('"%JAVA_EXE%" %DEFAULT_JVM_OPTS% %JAVA_OPTS% %MESH_APP_OPTS%  -classpath "%CLASSPATH%" ')) {
			return "\"%JAVA_EXE%\" %DEFAULT_JVM_OPTS% %JAVA_OPTS% %MESH_APP_OPTS% --module-path \"%APP_HOME%\\lib\\fx\" --add-modules javafx.controls -classpath \"%CLASSPATH%\" ${application.mainClass.get()} %*"
		}
		return line
	}

	scriptFile.setText(patched.join('\r\n') + '\r\n', 'UTF-8')
}

def copyDirectory = { File sourceDir, File targetDir ->
	if (!sourceDir.isDirectory()) {
		throw new GradleException("copyDirectory: source directory not found: ${sourceDir}")
	}
	def sourcePath = sourceDir.toPath()
	def targetPath = targetDir.toPath()
	def stream = java.nio.file.Files.walk(sourcePath)
	try {
		stream.forEach { path ->
			def relative = sourcePath.relativize(path)
			def target = targetPath.resolve(relative)
			if (java.nio.file.Files.isSymbolicLink(path)) {
				java.nio.file.Files.createDirectories(target.parent)
				java.nio.file.Files.deleteIfExists(target)
				java.nio.file.Files.createSymbolicLink(target, java.nio.file.Files.readSymbolicLink(path))
			} else if (java.nio.file.Files.isDirectory(path, java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
				java.nio.file.Files.createDirectories(target)
			} else {
				java.nio.file.Files.createDirectories(target.parent)
				java.nio.file.Files.copy(
					path,
					target,
					java.nio.file.StandardCopyOption.REPLACE_EXISTING,
					java.nio.file.StandardCopyOption.COPY_ATTRIBUTES
				)
			}
		}
	} finally {
		stream.close()
	}
}

def preparePackagingLibDir = { os, installDir, stagingRoot ->
	if (stagingRoot.exists()) {
		stagingRoot.deleteDir()
	}
	stagingRoot.mkdirs()

	def sourceLibDir = new File(installDir, "lib")
	if (!sourceLibDir.isDirectory()) {
		throw new GradleException("packaging: installDist lib directory not found: ${sourceLibDir}")
	}

	def libDir = new File(stagingRoot, "lib")
	copyDirectory(sourceLibDir, libDir)

	// Move JavaFX JARs into a subdirectory; only they should be on the module path.
	// If the whole $APPDIR is on the module path, the app JAR becomes an automatic module,
	// and --add-opens ...=ALL-UNNAMED stops working, breaking HWND reflection.
	relocateJavaFxJars(libDir)

	// Windows: copy meshapp-ble.dll (WinRT BLE) into lib/ for packaging.
	if (os.isWindows()) {
		def bleDll = file('src/main/resources/win32-x86-64/meshapp-ble.dll')
		if (bleDll.exists()) {
			java.nio.file.Files.copy(
				bleDll.toPath(),
				new File(libDir, bleDll.name).toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING
			)
			logger.lifecycle("packaging: meshapp-ble.dll скопирован в lib/")
		}

		def arch = System.getProperty('os.arch').toLowerCase(java.util.Locale.ROOT)
		def jSerialCommArch
		if (['amd64', 'x86_64'].contains(arch)) {
			jSerialCommArch = 'x86_64'
		} else if (['aarch64', 'arm64'].contains(arch)) {
			jSerialCommArch = 'aarch64'
		} else if (['x86', 'i386', 'i686'].contains(arch)) {
			jSerialCommArch = 'x86'
		} else {
			throw new GradleException("packaging: unsupported Windows architecture for jSerialComm: ${arch}")
		}
		def jSerialCommJar = libDir.listFiles()?.find {
			it.name ==~ /jSerialComm-[0-9].*\.jar/
		}
		if (jSerialCommJar == null) {
			throw new GradleException("packaging: jSerialComm jar not found in ${libDir}")
		}
		def jSerialCommEntryName = "Windows/${jSerialCommArch}/jSerialComm.dll"
		def jSerialCommDll = new File(libDir, 'jSerialComm.dll')
		new java.util.jar.JarFile(jSerialCommJar).withCloseable { jarFile ->
			def entry = jarFile.getEntry(jSerialCommEntryName)
			if (entry == null) {
				throw new GradleException("packaging: ${jSerialCommEntryName} not found in ${jSerialCommJar.name}")
			}
			jarFile.getInputStream(entry).withCloseable { input ->
				java.nio.file.Files.copy(
					input,
					jSerialCommDll.toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING
				)
			}
		}
		logger.lifecycle("packaging: jSerialComm.dll (${jSerialCommArch}) извлечён в lib/")
	}

	// Linux: copy libmeshapp-ble.so (BlueZ BLE) into lib/ for packaging.
	if (os.isLinux()) {
		def bleSo = new File(generatedResourcesDir.get().asFile, "${linuxJnaResourcePrefix()}/libmeshapp-ble.so")
		if (bleSo.exists()) {
			java.nio.file.Files.copy(
				bleSo.toPath(),
				new File(libDir, bleSo.name).toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING
			)
			logger.lifecycle("packaging: libmeshapp-ble.so скопирован в lib/")
		}
	}

	return libDir
}

def prepareLinuxPackagingResources = {
	def linuxResourceDir = layout.buildDirectory.dir("jpackage/linux-resources").get().asFile
	if (linuxResourceDir.exists()) {
		linuxResourceDir.deleteDir()
	}
	linuxResourceDir.mkdirs()

	def linuxLauncherIcon = new File(linuxResourceDir, 'MeshApp.png')
	java.nio.file.Files.copy(
		file('src/main/resources/logo/icon_512.png').toPath(),
		linuxLauncherIcon.toPath(),
		java.nio.file.StandardCopyOption.REPLACE_EXISTING
	)

	def linuxScriptsDir = file('src/jpackage/linux')
	['postinstall', 'postrm'].each { scriptName ->
		def source = new File(linuxScriptsDir, scriptName)
		if (source.exists()) {
			def target = new File(linuxResourceDir, scriptName)
			java.nio.file.Files.copy(
				source.toPath(),
				target.toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING
			)
			target.setExecutable(true, false)
		}
	}

	return linuxResourceDir
}

def resolveBuildOption = { String propertyName, String envName ->
	def propertyValue = findProperty(propertyName)?.toString()?.trim()
	if (propertyValue) {
		return propertyValue
	}
	def envValue = System.getenv(envName)?.trim()
	return envValue ?: null
}

def executePackagingCommand = { List<?> args, String failureMessage, File workingDir = projectRootDir, boolean logOutput = true ->
	def process = new ProcessBuilder(args.collect { it.toString() })
		.directory(workingDir)
		.redirectErrorStream(true)
		.start()
	def output = process.inputStream.text
	process.waitFor()
	if (output && logOutput) {
		logger.lifecycle(output.trim())
	}
	if (process.exitValue() != 0) {
		throw new GradleException(output ? "${failureMessage}: ${output}" : failureMessage)
	}
	return output
}

def collectMacDependencyScanFiles = { File appDir ->
	def scanFiles = [] as Set<File>

	[new File(appDir, 'Contents/MacOS'), new File(appDir, 'Contents/runtime/Contents/MacOS')].each { dir ->
		if (dir.isDirectory()) {
			dir.listFiles()?.findAll { it.isFile() }?.each { scanFiles << it }
		}
	}

	[new File(appDir, 'Contents/app'), new File(appDir, 'Contents/runtime/Contents/Home/lib')].each { dir ->
		if (dir.isDirectory()) {
			dir.eachFileRecurse(FileType.FILES) { f ->
				def lowerName = f.name.toLowerCase(java.util.Locale.ROOT)
				if (lowerName.endsWith('.dylib') || lowerName.endsWith('.jnilib')) {
					scanFiles << f
				}
			}
		}
	}

	return scanFiles.toList().sort { it.absolutePath }
}

def readMacLinkedLibraries = { File binary, String taskName ->
	def output = executePackagingCommand(
		['otool', '-L', binary.absolutePath],
		"${taskName}: failed to inspect native dependencies for ${binary}",
		projectRootDir,
		false
	)
	def lines = output.readLines()
	if (lines.size() <= 1) {
		return []
	}
	return lines.tail()
		.collect { line ->
			def trimmed = line.trim()
			if (!trimmed) {
				return null
			}
			return trimmed.split(/\s+\(/, 2)[0]
		}
		.findAll { it != null }
}

def readMacInstallName = { File binary, String taskName ->
	def output = executePackagingCommand(
		['otool', '-D', binary.absolutePath],
		"${taskName}: failed to inspect install name for ${binary}",
		projectRootDir,
		false
	)
	def lines = output.readLines()
	if (lines.size() <= 1) {
		return null
	}
	return lines[1].trim()
}

def isAllowedMacNativeDependency = { String dependency ->
	dependency.startsWith('@rpath/')
		|| dependency.startsWith('@loader_path/')
		|| dependency.startsWith('@executable_path/')
		|| dependency.startsWith('/System/Library/')
		|| dependency.startsWith('/usr/lib/')
		|| dependency.startsWith('/Library/Apple/')
}

def normalizeMacBundleInstallNames = { File appDir, String taskName ->
	collectMacDependencyScanFiles(appDir).each { binary ->
		def lowerName = binary.name.toLowerCase(java.util.Locale.ROOT)
		if (lowerName.endsWith('.dylib') || lowerName.endsWith('.jnilib')) {
			def installName = readMacInstallName(binary, taskName)
			if (installName != null && !isAllowedMacNativeDependency(installName)) {
				def normalizedInstallName = "@rpath/${binary.name}"
				executePackagingCommand(
					['install_name_tool', '-id', normalizedInstallName, binary.absolutePath],
					"${taskName}: failed to normalize install name for ${binary}",
					projectRootDir,
					false
				)
				logger.lifecycle("${taskName}: normalized install name for ${binary.name} -> ${normalizedInstallName}")
			}
		}
	}
}

def assertMacBundleSelfContained = { File appDir, String taskName ->
	if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		return
	}

	def violations = []
	collectMacDependencyScanFiles(appDir).each { binary ->
		readMacLinkedLibraries(binary, taskName).each { dependency ->
			if (!isAllowedMacNativeDependency(dependency)) {
				violations << "${binary.absolutePath} -> ${dependency}"
			}
		}
	}

	if (!violations.isEmpty()) {
		def details = violations.unique().sort().collect { " - ${it}" }.join('\n')
		throw new GradleException("""${taskName}: macOS bundle contains external native dependencies outside the app bundle.
${details}
Use a self-contained JDK for packaging via -PpackagingJavaHome=/path/to/jdk or PACKAGING_JAVA_HOME=/path/to/jdk.""")
	}
}

def assertMacRuntimeJavaLauncher = { File appDir, String taskName ->
	def javaLauncher = new File(appDir, 'Contents/runtime/Contents/Home/bin/java')
	if (!javaLauncher.isFile()) {
		throw new GradleException(
			"${taskName}: bundled runtime must contain bin/java for payload self-update launcher: ${javaLauncher}"
		)
	}
}

def appendMacSigningOptions = { List args, Map signingConfig, boolean includeEntitlements = false, File entitlementsFile = null ->
	if (signingConfig == null) {
		return args
	}
	args << '--mac-sign'
	args << '--mac-signing-key-user-name'
	args << signingConfig.keyUserName
	if (signingConfig.keychain) {
		args << '--mac-signing-keychain'
		args << signingConfig.keychain
	}
	if (signingConfig.signingPrefix) {
		args << '--mac-package-signing-prefix'
		args << signingConfig.signingPrefix
	}
	if (includeEntitlements && entitlementsFile?.exists()) {
		args << '--mac-entitlements'
		args << entitlementsFile.absolutePath
	}
	return args
}

def resolveMacSigningConfig = {
	def keyUserName = resolveBuildOption('macSigningKeyUserName', 'MAC_SIGNING_KEY_USER_NAME')
	if (!keyUserName) {
		return null
	}
	return [
		keyUserName : keyUserName,
		keychain    : resolveBuildOption('macSigningKeychain', 'MAC_SIGNING_KEYCHAIN'),
		signingPrefix: resolveBuildOption('macPackageSigningPrefix', 'MAC_PACKAGE_SIGNING_PREFIX') ?: 'com.meshtastic'
	]
}

def resolveMacNotarizationConfig = {
	def keychainProfile = resolveBuildOption('macNotaryKeychainProfile', 'MAC_NOTARY_KEYCHAIN_PROFILE')
	if (keychainProfile) {
		return [mode: 'keychainProfile', keychainProfile: keychainProfile]
	}

	def appleId = resolveBuildOption('macNotaryAppleId', 'MAC_NOTARY_APPLE_ID')
	def teamId = resolveBuildOption('macNotaryTeamId', 'MAC_NOTARY_TEAM_ID')
	def password = resolveBuildOption('macNotaryPassword', 'MAC_NOTARY_PASSWORD')
	if (appleId || teamId || password) {
		if (!appleId || !teamId || !password) {
			throw new GradleException(
				"macOS notarization requires macNotaryAppleId/MAC_NOTARY_APPLE_ID, " +
				"macNotaryTeamId/MAC_NOTARY_TEAM_ID and macNotaryPassword/MAC_NOTARY_PASSWORD"
			)
		}
		return [mode: 'appleId', appleId: appleId, teamId: teamId, password: password]
	}

	def keyFilePath = resolveBuildOption('macNotaryKeyFile', 'MAC_NOTARY_KEY_FILE')
	def keyId = resolveBuildOption('macNotaryKeyId', 'MAC_NOTARY_KEY_ID')
	def issuer = resolveBuildOption('macNotaryIssuer', 'MAC_NOTARY_ISSUER')
	if (keyFilePath || keyId || issuer) {
		if (!keyFilePath || !keyId || !issuer) {
			throw new GradleException(
				"macOS notarization with App Store Connect API key requires " +
				"macNotaryKeyFile/MAC_NOTARY_KEY_FILE, macNotaryKeyId/MAC_NOTARY_KEY_ID " +
				"and macNotaryIssuer/MAC_NOTARY_ISSUER"
			)
		}
		def keyFile = file(keyFilePath)
		if (!keyFile.isFile()) {
			throw new GradleException("macOS notarization key file not found: ${keyFile}")
		}
		return [mode: 'apiKey', keyFile: keyFile.absolutePath, keyId: keyId, issuer: issuer]
	}

	return null
}

def notarizeMacArtifact = { File artifact, Map notarizationConfig ->
	if (notarizationConfig == null) {
		return
	}

	def submitArgs = ['xcrun', 'notarytool', 'submit', artifact.absolutePath, '--wait']
	switch (notarizationConfig.mode) {
		case 'keychainProfile':
			submitArgs << '--keychain-profile'
			submitArgs << notarizationConfig.keychainProfile
			break
		case 'appleId':
			submitArgs << '--apple-id'
			submitArgs << notarizationConfig.appleId
			submitArgs << '--team-id'
			submitArgs << notarizationConfig.teamId
			submitArgs << '--password'
			submitArgs << notarizationConfig.password
			break
		case 'apiKey':
			submitArgs << '--key'
			submitArgs << notarizationConfig.keyFile
			submitArgs << '--key-id'
			submitArgs << notarizationConfig.keyId
			submitArgs << '--issuer'
			submitArgs << notarizationConfig.issuer
			break
		default:
			throw new GradleException("Unsupported notarization mode: ${notarizationConfig.mode}")
	}

	executePackagingCommand(submitArgs, "notarytool failed for ${artifact.name}")
	executePackagingCommand(['xcrun', 'stapler', 'staple', artifact.absolutePath], "stapler failed for ${artifact.name}")
	executePackagingCommand(['xcrun', 'stapler', 'validate', artifact.absolutePath], "stapler validation failed for ${artifact.name}")
}

def adHocSignMacBundle = { File appDir, File entitlements ->
	def signFile = { File target, boolean withEntitlements ->
		def signArgs = ['codesign', '--force', '--sign', '-', '--timestamp=none']
		if (withEntitlements && entitlements.exists()) {
			signArgs << '--entitlements'
			signArgs << entitlements.absolutePath
		}
		signArgs << target.absolutePath
		executePackagingCommand(signArgs, "codesign failed for ${target.name}")
	}

	def runtimeLib = new File(appDir, 'Contents/runtime/Contents/Home/lib')
	if (runtimeLib.exists()) {
		runtimeLib.eachFileRecurse { f ->
			if (f.name.endsWith('.dylib') || f.name.endsWith('.jnilib')) {
				signFile(f, false)
			}
		}
	}

	def runtimeMacOs = new File(appDir, 'Contents/runtime/Contents/MacOS')
	if (runtimeMacOs.exists()) {
		runtimeMacOs.listFiles()?.each { f ->
			if (f.name.endsWith('.dylib')) {
				signFile(f, false)
			}
		}
	}

	def runtimeBundle = new File(appDir, 'Contents/runtime')
	if (runtimeBundle.exists()) {
		signFile(runtimeBundle, false)
	}

	def mainExe = new File(appDir, 'Contents/MacOS/MeshApp')
	if (mainExe.exists()) {
		signFile(mainExe, true)
	}

	signFile(appDir, true)
	executePackagingCommand(
		['codesign', '--verify', '--deep', '--strict', appDir.absolutePath],
		"Signature verification failed for ${appDir.name}"
	)
}

def sanitizeArtifactVersion = { value ->
	value.replaceAll(/[^A-Za-z0-9._-]+/, '_')
}

def normalizeArtifactArch = {
	def arch = System.getProperty('os.arch').toLowerCase(java.util.Locale.ROOT)
	switch (arch) {
		case ['amd64', 'x86_64']:
			return 'x86_64'
		case ['aarch64', 'arm64']:
			return 'aarch64'
		default:
			return sanitizeArtifactVersion(arch)
	}
}

def resolveSelfUpdatePlatform = {
	def os = org.gradle.internal.os.OperatingSystem.current()
	def osName = os.isWindows() ? 'windows' : (os.isMacOsX() ? 'macos' : (os.isLinux() ? 'linux' : 'unknown'))
	return "${osName}-${normalizeArtifactArch()}"
}

def flatpakAppId = 'app.privatepractice.meshapp'
def flatpakMetadataDir = file('src/flatpak')
def flatpakDesktopFileName = "${flatpakAppId}.desktop"
def flatpakMetainfoFileName = "${flatpakAppId}.metainfo.xml"
def flatpakLauncherFileName = 'MeshApp'

def resolveLinuxAppImageArch = {
	return normalizeArtifactArch()
}

def resolveAppImageTool = {
	def configuredPath = (findProperty('appimagetool') ?: System.getenv('APPIMAGETOOL'))?.toString()?.trim()
	if (configuredPath) {
		def configured = file(configuredPath)
		if (configured.isFile() && configured.canExecute()) {
			return configured
		}
		throw new GradleException("appImage: appimagetool not found or not executable: ${configured}")
	}

	def candidateNames = [
		'appimagetool',
		'appimagetool.AppImage',
		"appimagetool-${resolveLinuxAppImageArch()}.AppImage"
	]
	def pathEntries = (System.getenv('PATH') ?: '')
		.split(java.util.regex.Pattern.quote(File.pathSeparator))
		.findAll { it }
	for (entry in pathEntries) {
		for (name in candidateNames) {
			def candidate = new File(entry, name)
			if (candidate.isFile() && candidate.canExecute()) {
				return candidate
			}
		}
	}
	return null
}

def resolveCommandExecutable = { String propertyName, String envName, String binaryName, String taskName ->
	def configuredPath = (findProperty(propertyName) ?: System.getenv(envName))?.toString()?.trim()
	if (configuredPath) {
		def configured = file(configuredPath)
		if (configured.isFile() && configured.canExecute()) {
			return configured
		}
		throw new GradleException("${taskName}: ${binaryName} not found or not executable: ${configured}")
	}

	def pathEntries = (System.getenv('PATH') ?: '')
		.split(java.util.regex.Pattern.quote(File.pathSeparator))
		.findAll { it }
	for (entry in pathEntries) {
		def candidate = new File(entry, binaryName)
		if (candidate.isFile() && candidate.canExecute()) {
			return candidate
		}
	}

	throw new GradleException(
		"${taskName}: ${binaryName} not found. Add it to PATH or pass -P${propertyName}=/path/to/${binaryName}"
	)
}

def requirePackagingFile = { String relativePath, String taskName ->
	def source = file(relativePath)
	if (!source.isFile()) {
		throw new GradleException("${taskName}: required packaging file not found: ${source}")
	}
	return source
}

def buildLinuxAppImage = { File installDir, File workDir, String taskName ->
	def os = org.gradle.internal.os.OperatingSystem.current()
	if (!os.isLinux()) {
		throw new GradleException("${taskName} task is supported only on Linux")
	}

	if (workDir.exists()) {
		workDir.deleteDir()
	}
	workDir.mkdirs()

	def appVersion = resolvePackageVersion(os)
	def javaHome = resolvePackagingJavaHome()
	def jpackageBin = "${javaHome}/bin/jpackage"
	def libDir = preparePackagingLibDir(os, installDir, new File(workDir, 'input'))
	def jvmArgsList = buildPackagingJvmArgs()
	def linuxResourceDir = prepareLinuxPackagingResources()
	def jlinkOptions = buildPackagingJlinkOptions()
	def iconSource = file('src/main/resources/logo/icon_512.png')
	if (!iconSource.exists()) {
		throw new GradleException("${taskName}: icon not found: ${iconSource}")
	}

	def jpackageArgs = [
		jpackageBin,
		'--type', 'app-image',
		'--name', 'MeshApp',
		'--app-version', appVersion,
		'--vendor', 'Meshtastic',
		'--copyright', 'Copyright © Konstantin A. Smirnov',
		'--dest', workDir.absolutePath,
		'--input', libDir.absolutePath,
		'--jlink-options', jlinkOptions,
		'--main-jar', applicationJarName,
		'--main-class', application.mainClass.get(),
		'--resource-dir', linuxResourceDir.absolutePath
	]

	jvmArgsList.each { arg ->
		jpackageArgs << '--java-options'
		jpackageArgs << arg
	}

	jpackageArgs << '--icon'
	jpackageArgs << iconSource.absolutePath

	executePackagingCommand(jpackageArgs, "${taskName}: jpackage app-image failed")

	def jpackageImageDir = new File(workDir, 'MeshApp')
	if (!jpackageImageDir.isDirectory()) {
		throw new GradleException("${taskName}: jpackage image not found: ${jpackageImageDir}")
	}

	return [imageDir: jpackageImageDir, iconFile: iconSource, appVersion: appVersion]
}

def writeFlatpakMetainfo = { File sourceFile, File targetFile, String appVersion ->
	def parser = new XmlParser(false, false)
	def component = parser.parse(sourceFile)
	def releases = component.releases ? component.releases[0] : component.appendNode('releases')
	def release = releases.release ? releases.release[0] : releases.appendNode('release')
	release.attributes()['version'] = appVersion
	release.attributes()['date'] = resolveFlatpakReleaseDate()

	def releaseTag = parseReleaseVersionInfo(appVersion)?.tag
	if (releaseTag) {
		component.depthFirst()
			.findAll { it.name() == 'image' }
			.each { image ->
				def current = image.text()
				def updated = current.replaceAll(/\/raw\/tag\/v?\d+\.\d+\.\d+\//, "/raw/tag/${releaseTag}/")
				if (updated != current) {
					image.setValue(updated)
				}
			}
	}

	targetFile.parentFile.mkdirs()
	def writer = new StringWriter()
	writer.write('<?xml version="1.0" encoding="UTF-8"?>\n')
	def printer = new XmlNodePrinter(new PrintWriter(writer), '  ')
	printer.preserveWhitespace = true
	printer.print(component)
	targetFile.setText(writer.toString(), 'UTF-8')
}

def prepareFlatpakSources = { File workDir, File appImageDir, File iconSource, String appVersion ->
	def sourceDir = new File(workDir, 'sources')
	if (sourceDir.exists()) {
		sourceDir.deleteDir()
	}
	sourceDir.mkdirs()

	copyDirectory(appImageDir, new File(sourceDir, 'meshapp'))

	def resourcesDir = new File(sourceDir, 'resources')
	resourcesDir.mkdirs()

	def desktopSource = requirePackagingFile("${flatpakMetadataDir.path}/${flatpakDesktopFileName}", 'flatpak')
	def metainfoSource = requirePackagingFile("${flatpakMetadataDir.path}/${flatpakMetainfoFileName}", 'flatpak')
	def launcherSource = requirePackagingFile("${flatpakMetadataDir.path}/${flatpakLauncherFileName}", 'flatpak')

	java.nio.file.Files.copy(
		desktopSource.toPath(),
		new File(resourcesDir, flatpakDesktopFileName).toPath(),
		java.nio.file.StandardCopyOption.REPLACE_EXISTING
	)
	writeFlatpakMetainfo(
		metainfoSource,
		new File(resourcesDir, flatpakMetainfoFileName),
		appVersion
	)
	java.nio.file.Files.copy(
		launcherSource.toPath(),
		new File(resourcesDir, flatpakLauncherFileName).toPath(),
		java.nio.file.StandardCopyOption.REPLACE_EXISTING
	)
	java.nio.file.Files.copy(
		iconSource.toPath(),
		new File(resourcesDir, "${flatpakAppId}.png").toPath(),
		java.nio.file.StandardCopyOption.REPLACE_EXISTING
	)

	return sourceDir
}

def writeFlatpakManifest = { File manifestFile, File sourceDir, String runtime, String runtimeVersion, String sdk ->
	def manifest = [
		'app-id'         : flatpakAppId,
		'runtime'        : runtime,
		'runtime-version': runtimeVersion,
		'sdk'            : sdk,
		'command'        : 'MeshApp',
		'finish-args'    : [
			'--share=network',
			'--share=ipc',
			// JavaFX on Linux uses the GTK/X11 backend, so Wayland + fallback-x11
			// breaks startup inside Flatpak on Wayland sessions ("Unable to open DISPLAY").
			'--socket=x11',
			'--socket=system-bus',
			'--device=dri',
			'--device=all',
			'--allow=bluetooth',
			'--filesystem=home',
			'--system-talk-name=org.bluez'
		],
		'modules'        : [[
			'name'          : 'meshapp',
			'buildsystem'   : 'simple',
			'build-commands': [
				'install -d /app/meshapp',
				'cp -a meshapp/. /app/meshapp/',
				"install -Dm755 resources/${flatpakLauncherFileName} /app/bin/MeshApp",
				"install -Dm644 resources/${flatpakDesktopFileName} /app/share/applications/${flatpakDesktopFileName}",
				"install -Dm644 resources/${flatpakMetainfoFileName} /app/share/metainfo/${flatpakMetainfoFileName}",
				"install -Dm644 resources/${flatpakAppId}.png /app/share/icons/hicolor/512x512/apps/${flatpakAppId}.png"
			],
			'sources'       : [[
				'type': 'dir',
				'path': sourceDir.absolutePath
			]]
		]]
	]

	manifestFile.parentFile.mkdirs()
	manifestFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n', 'UTF-8')
}

def normalizeDebDependencyToken = { String token ->
	def trimmed = token?.trim()
	if (!trimmed || trimmed.contains('|')) {
		return trimmed
	}

	def matcher = trimmed =~ /^([A-Za-z0-9.+:-]+?)t64(\s*\([^)]+\))?$/
	if (!matcher.matches()) {
		return trimmed
	}

	def basePackage = matcher.group(1)
	def versionConstraint = matcher.group(2) ?: ''
	return "${basePackage}${versionConstraint} | ${trimmed}"
}

def normalizeDebControlDependencies = { String controlText ->
	def separator = controlText.contains('\r\n') ? '\r\n' : '\n'
	def endsWithNewline = controlText.endsWith('\n') || controlText.endsWith('\r\n')
	def normalized = controlText.readLines().collect { line ->
		if (!line.startsWith('Depends:')) {
			return line
		}
		def value = line.substring('Depends:'.length()).trim()
		if (!value) {
			return line
		}
		def normalizedDepends = value
			.split(/\s*,\s*/)
			.collect(normalizeDebDependencyToken)
			.join(', ')
		return "Depends: ${normalizedDepends}"
	}.join(separator)

	return endsWithNewline ? normalized + separator : normalized
}

def patchLinuxDebControl = { File outputDir ->
	def debFiles = outputDir.listFiles()?.findAll { it.name.endsWith('.deb') } ?: []
	debFiles.each { debFile ->
		def repackRoot = new File(layout.buildDirectory.dir("tmp/deb-repack/${debFile.name}").get().asFile, 'root')
		if (repackRoot.exists()) {
			repackRoot.deleteDir()
		}
		repackRoot.mkdirs()

		def unpackProc = new ProcessBuilder(
			'dpkg-deb', '-R', debFile.absolutePath, repackRoot.absolutePath
		).redirectErrorStream(true).start()
		def unpackOutput = unpackProc.inputStream.text
		unpackProc.waitFor()
		if (unpackOutput) logger.lifecycle(unpackOutput.trim())
		if (unpackProc.exitValue() != 0) {
			throw new GradleException("jpackage: failed to unpack ${debFile.name} for control patching")
		}

		def controlFile = new File(repackRoot, 'DEBIAN/control')
		if (!controlFile.isFile()) {
			throw new GradleException("jpackage: Debian control file not found: ${controlFile}")
		}

		def originalControl = controlFile.getText('UTF-8')
		def patchedControl = normalizeDebControlDependencies(originalControl)
		if (patchedControl != originalControl) {
			controlFile.setText(patchedControl, 'UTF-8')
			logger.lifecycle("jpackage: normalized Debian dependencies in ${debFile.name}")
		}

		def rebuildProc = new ProcessBuilder(
			'dpkg-deb', '--build', '--root-owner-group',
			repackRoot.absolutePath, debFile.absolutePath
		).redirectErrorStream(true).start()
		def rebuildOutput = rebuildProc.inputStream.text
		rebuildProc.waitFor()
		if (rebuildOutput) logger.lifecycle(rebuildOutput.trim())
		if (rebuildProc.exitValue() != 0) {
			throw new GradleException("jpackage: failed to rebuild ${debFile.name} after control patching")
		}

		repackRoot.parentFile?.deleteDir()
	}
}

