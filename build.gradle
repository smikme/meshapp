def selfUpdateRequiredJarEntries = [
	'com/meshtastic/client/AppVersion.class',
	'com/meshtastic/client/notification/MacOsNotificationBroker.class',
	'com/meshtastic/client/notification/MacOsNotificationService.class',
	'com/meshtastic/client/notification/NotificationService.class',
