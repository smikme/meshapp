def jmxDebugJvmArgs = {
	def port = jmxDebugPort.get()
	if (!(port ==~ /\d{1,5}/)) {
		throw new GradleException("jmxDebugPort must be a TCP port number, got '${port}'")
	}
	def portNumber = Integer.parseInt(port)
	if (portNumber < 1 || portNumber > 65535) {
		throw new GradleException("jmxDebugPort must be between 1 and 65535, got '${port}'")
	}
	return [
		'-Dcom.sun.management.jmxremote',
		'-Dcom.sun.management.jmxremote.authenticate=false',
		'-Dcom.sun.management.jmxremote.ssl=false',
		'-Dcom.sun.management.jmxremote.local.only=true',
		'-Dcom.sun.management.jmxremote.host=127.0.0.1',
		"-Dcom.sun.management.jmxremote.port=${port}",
		"-Dcom.sun.management.jmxremote.rmi.port=${port}",
		'-Djava.rmi.server.hostname=127.0.0.1'
	]
}

def visualVmProfilerJvmArgs = {
