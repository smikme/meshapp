def parseReleaseVersionInfo = { rawTag ->
	if (rawTag == null) {
		return null
	}
	def tag = rawTag.trim()
	if (tag.startsWith('refs/tags/')) {
		tag = tag.substring('refs/tags/'.length())
	}
	def matcher = tag =~ /^v?(\d+)\.(\d+)\.(\d+)$/
	if (!matcher.matches()) {
		return null
	}
	def packageVersion = "${matcher[0][1]}.${matcher[0][2]}.${matcher[0][3]}"
	return [
		tag: tag.startsWith('v') ? tag : "v${packageVersion}",
		packageVersion: packageVersion
	]
}

def resolveReleaseVersionInfo = {
	def candidates = [
		findProperty('releaseTag')?.toString(),
		findProperty('meshappVersion')?.toString(),
		System.getenv('MESHAPP_VERSION'),
		System.getenv('GITHUB_REF_NAME'),
		System.getenv('GITHUB_REF')
	]
	for (def candidate : candidates) {
		def versionInfo = parseReleaseVersionInfo(candidate)
		if (versionInfo != null) {
			return versionInfo
		}
	}

	try {
		def tags = 'git tag --points-at HEAD'.execute().text.readLines()
			.collect { it.trim() }
			.findAll { !it.isEmpty() }
			.collect { tag ->
				def versionInfo = parseReleaseVersionInfo(tag)
				versionInfo == null ? null : [tag: tag, versionInfo: versionInfo]
			}
			.findAll { it != null }
			.sort { a, b ->
				def left = a.versionInfo.packageVersion.tokenize('.').collect { it.toInteger() }
				def right = b.versionInfo.packageVersion.tokenize('.').collect { it.toInteger() }
				for (int i = 0; i < 3; i++) {
					def cmp = right[i] <=> left[i]
					if (cmp != 0) {
						return cmp
					}
				}
				return a.tag <=> b.tag
			}
		if (!tags.isEmpty()) {
			return tags[0].versionInfo
		}
	} catch (ignored) {
		return null
	}

	return null
}

